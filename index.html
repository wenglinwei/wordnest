<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WordNest">
<meta name="theme-color" content="#18202a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>WordNest V3.3 — English Learning</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f7fb;color:#18202a;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",Arial,sans-serif}
.app{max-width:720px;margin:auto;min-height:100vh;padding:18px 16px 40px}
header{padding:8px 2px 10px}
h1{font-size:30px;margin:0 0 4px}
.sub{color:#6b7280;font-size:14px}
.search{display:flex;gap:8px;background:white;padding:10px;border-radius:18px;box-shadow:0 5px 20px #0000000b;align-items:center}
input{flex:1;border:0;outline:0;font-size:18px;min-width:0;padding:8px 10px;background:transparent}
button{border:0;border-radius:13px;padding:10px 14px;font-weight:700;font-size:15px;background:#18202a;color:white;cursor:pointer}
button.secondary{background:#eef1f5;color:#18202a}
button:disabled{opacity:.45;cursor:default}
nav{display:flex;gap:8px;margin:14px 0;overflow:auto}
nav button{white-space:nowrap;background:#fff;color:#4b5563;position:relative}
nav button.active{background:#18202a;color:white}
.badge{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;border-radius:999px;background:#ef4444;color:#fff;font-size:12px;font-weight:800;vertical-align:2px}
.card{background:white;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 5px 20px #00000008}
.word{font-size:32px;font-weight:800;margin:0 0 5px;word-break:break-word}
.pos{color:#7c3aed;font-weight:700}
.phonetic{color:#6b7280;font-size:16px;font-weight:600}
.zh{font-size:22px;font-weight:700;margin:12px 0}
.meaning{line-height:1.6;color:#374151}
.example{background:#f6f7fb;padding:13px;border-radius:14px;margin-top:12px;line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{background:#eef1f5;border-radius:999px;padding:7px 10px;font-size:14px;cursor:pointer}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.actions button{flex:1;min-width:120px}
.empty{text-align:center;color:#6b7280;padding:45px 15px}
.hidden{display:none!important}
.item{padding:13px 0;border-bottom:1px solid #edf0f3;display:flex;align-items:center;justify-content:space-between;gap:10px}
.item:last-child{border-bottom:0}
.item b{font-size:18px}
.small{font-size:13px;color:#6b7280}
.graph{height:300px;background:#f7f8fb;border-radius:16px;position:relative;overflow:hidden;margin-top:14px}
.node{position:absolute;padding:9px 12px;border-radius:999px;background:white;box-shadow:0 3px 12px #0002;font-weight:700;font-size:14px;cursor:pointer}
.line{position:absolute;height:2px;background:#cfd5dc;transform-origin:0 50%}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#18202a;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:50;max-width:90%;text-align:center}
footer{text-align:center;color:#9ca3af;font-size:12px;margin-top:25px;line-height:1.5}
.stats{display:flex;gap:10px;margin:12px 0}
.stat{flex:1;background:white;border-radius:18px;padding:14px 10px;text-align:center;box-shadow:0 5px 20px #00000008}
.stat .num{font-size:28px;font-weight:800}
.stat .num.due{color:#ef4444}
.stat .lbl{font-size:12px;color:#6b7280;margin-top:2px}
.iconbtn{flex:0 0 auto;width:44px;height:44px;border-radius:13px;padding:0;font-size:20px;background:#eef1f5;color:#18202a}
.speakbtn{background:#eef1f5;color:#18202a;border-radius:999px;padding:6px 12px;font-size:15px;vertical-align:middle;margin-left:8px}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{flex:1}
.fc{text-align:center;padding:26px 18px}
.fc .fcword{font-size:40px;font-weight:800;word-break:break-word;margin:10px 0}
.fc .hint{color:#9ca3af;font-size:14px;margin-top:8px}
.progress{height:8px;background:#eef1f5;border-radius:99px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:#18202a;border-radius:99px;transition:width .3s}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.grades button{padding:12px 4px;font-size:16px;color:#fff}
.grades .iv{display:block;font-size:12px;font-weight:600;opacity:.8;margin-top:3px}
.g-again{background:#ef4444}.g-hard{background:#f59e0b}.g-good{background:#22c55e}.g-easy{background:#3b82f6}
.cropwrap{position:relative;width:100%;overflow:hidden;border-radius:14px;background:#111;touch-action:none;user-select:none;-webkit-user-select:none}
.cropwrap img{display:block;width:100%;pointer-events:none}
.cropbox{position:absolute;border:2.5px solid #22c55e;box-shadow:0 0 0 9999px rgba(0,0,0,.45);border-radius:6px;cursor:move;touch-action:none}
.crophandle{position:absolute;right:-14px;bottom:-14px;width:28px;height:28px;border-radius:50%;background:#22c55e;color:#fff;font-size:16px;line-height:28px;text-align:center;cursor:nwse-resize;touch-action:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:#eef1f5;color:#6b7280;border-radius:999px;padding:8px 12px;font-size:15px;font-weight:700;cursor:pointer}
.field{margin:12px 0}
.field label{display:block;font-size:13px;color:#6b7280;margin-bottom:6px;font-weight:700}
.field input{width:100%;border:1.5px solid #e5e7eb;border-radius:12px;padding:11px 12px;font-size:16px;background:#fff}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid #d1d5db;border-top-color:#18202a;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.recording{background:#ef4444!important;color:#fff!important}
#q.searched{color:#9ca3af}
.tag .gl{color:#6b7280;font-weight:400;font-size:12px}
.node .gl{display:block;font-size:11px;font-weight:400;color:#6b7280}
.capzh{color:#047857;font-weight:700;font-size:15px;margin-top:2px}
.histlbl{font-size:12px;color:#9ca3af;margin:8px 2px 0}
.capline{padding:3px 0;border-bottom:1px dashed #e8ebf0}
.capline:last-child{border-bottom:0}
.tok{display:inline-block;padding:2px 4px;margin:1px 0;border-radius:7px;cursor:pointer;font-size:17px;line-height:1.5}
.tok:hover{background:#eef1f5}
.tok.sel{background:#fde68a;font-weight:700;box-shadow:inset 0 0 0 1.5px #f59e0b}
.tok.pre{box-shadow:inset 0 -3px 0 #f59e0b}
.captext{background:#f7f8fb;border-radius:14px;padding:12px;margin-top:10px}
mark{background:#fde68a;border-radius:4px;padding:0 3px}
textarea{width:100%;border:1.5px solid #e5e7eb;border-radius:12px;padding:11px 12px;font-size:16px;font-family:inherit;min-height:84px}
</style>
</head>
<body>
<div class="app">
<header>
<h1>🌱 WordNest <span style="font-size:15px;color:#7c3aed">V3.3</span></h1>
<div class="sub">查单词 → 理解 → 建立词汇关系 → 间隔复习</div>
</header>

<div class="search" style="margin-top:14px">
<input id="q" autocomplete="off" autocapitalize="none" placeholder="输入单词，或粘贴一整段英文点选生词">
<button class="iconbtn" id="micBtn" title="语音输入">🎤</button>
<button id="searchBtn">查询</button>
</div>
<div id="searchHistory" class="hidden"><div class="histlbl">最近查询（点一下再看）</div><div class="chips" id="historyChips" style="margin-top:6px"></div></div>
<div class="tools">
<button class="secondary" id="photoBtn">📷 拍照收词</button>
<input type="file" id="photoInput" accept="image/*" class="hidden">
</div>

<section id="ocrPanel" class="card hidden">
<h2 style="margin-top:0">✂️ 框选要识别的英文</h2>
<div class="small" style="margin-bottom:10px">拖动绿框选区域。</div>
<div class="cropwrap" id="cropWrap">
<img id="cropImg" alt="待识别照片">
<div class="cropbox" id="cropBox"><div class="crophandle" id="cropHandle">↘</div></div>
</div>
<div class="actions">
<button id="ocrRunBtn">🔎 识别框选区域</button>
<button class="secondary" id="ocrCancelBtn">取消</button>
</div>
<div id="ocrStatus" class="small" style="margin-top:10px"></div>
<div id="ocrResult"></div>
</section>

<section id="capturePanel" class="card hidden">
<h2 style="margin-top:0">👆 点选生词</h2>
<div id="captureArea"></div>
</section>

<nav>
<button class="active" data-tab="search">🔍 搜索</button>
<button data-tab="review">🃏 复习<span class="badge hidden" id="dueBadge">0</span></button>
<button id="navMore" type="button">⚙️ 更多</button>
</nav>
<div id="moreMenu" class="tools hidden">
<button class="secondary" data-menu="library">📚 我的词库</button>
<button class="secondary" data-menu="settings">⚙️ 设置 · AI</button>
</div>

<section id="searchTab">
<div id="result" class="empty">试试 <b>hello</b>、<b>improve</b>、<b>figure out</b><br><span class="small">支持中文输入，如「承担」；粘贴整段英文可点选生词</span></div>
</section>

<section id="reviewTab" class="hidden">
<div id="session"></div>
</section>

<section id="libraryTab" class="hidden">
<div class="card">
<div style="display:flex;align-items:center;justify-content:space-between"><h2 style="margin:0">我的词库</h2><button class="secondary" data-action="goto-search">收起 ▲</button></div>
<div class="field"><input id="libFilter" placeholder="🔎 在词库里找词…"></div>
<div id="libraryList"></div>
</div>
</section>

<section id="settingsTab" class="hidden">
<div class="card">
<h2>✨ AI</h2>
<div class="small">填 Key 后，查词不完整时自动用 AI 补全词根、相关词和释义。Key 只存本机。</div>
<div class="field"><label>服务商</label>
<select id="aiPreset" style="width:100%;border:1.5px solid #e5e7eb;border-radius:12px;padding:11px 12px;font-size:16px;background:#fff">
<option value="">自定义</option>
<option value="openai">OpenAI</option>
<option value="deepseek">DeepSeek</option>
<option value="qwen">通义千问</option>
<option value="moonshot">Kimi</option><option value="gemini">Google Gemini（免费额度）</option><option value="siliconflow">硅基流动</option>
</select></div>
<div class="field"><label>API 地址</label><input id="aiBase" placeholder="https://api.openai.com/v1"></div>
<div class="field"><label>API Key</label><input id="aiKey" type="password" placeholder="sk-..."></div>
<div class="field"><label>模型</label><input id="aiModel" placeholder="gpt-4o-mini"></div>
<div class="field"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="aiAuto" style="flex:0 0 auto;width:20px;height:20px" checked> 查词不完整时自动 AI 补全</label></div>
<div class="actions"><button id="aiSaveBtn">保存</button></div>
</div>
<div class="card">
<h2>🔊 复习</h2>
<label style="display:flex;gap:8px;align-items:center;font-size:15px;color:#374151"><input type="checkbox" id="autoSpeak" checked> 闪卡出现时自动朗读单词</label>
</div>
<div class="card">
<h2>数据</h2>
<div class="meaning">词库存在本机浏览器里。</div>
<div class="actions"><button class="secondary" id="exportBtn">导出词库 JSON</button></div>
</div>
</section>

<footer>WordNest · 数据存本机</footer>
</div>

<div id="toast" class="toast"></div>

<script>
"use strict";

const DICT = {
"hello":{"pos":"interjection / noun","zh":"你好；用于打招呼，也可以表示问候。","meaning":"A friendly word used when you meet or greet someone.","example":"Hello! Nice to meet you.","family":["hello","hello there"],"root":"常用问候语；不是按拉丁词根拆分的词。"},
"improve":{"pos":"verb","zh":"改善；提高；变得更好。","meaning":"To make something better, or to become better.","example":"I want to improve my English.","family":["improvement","improved","improving"],"root":"improve → improvement（改善、提高）"},
"important":{"pos":"adjective","zh":"重要的；值得重视的。","meaning":"Having a lot of value, meaning, or importance.","example":"This is an important lesson.","family":["importance","importantly"],"root":"important → importance"},
"achieve":{"pos":"verb","zh":"实现；达到（目标）。","meaning":"To successfully reach a goal after working toward it.","example":"She worked hard to achieve her goal.","family":["achievement","achievable","achieved"],"root":"achieve → achievement（成就）"},
"resilient":{"pos":"adjective","zh":"有韧性的；能从困难中恢复的。","meaning":"Able to recover and keep going after difficulty.","example":"Children can be surprisingly resilient.","family":["resilience","resiliently"],"root":"resilient → resilience"},
"contribute":{"pos":"verb","zh":"贡献；促成；投稿。","meaning":"To give something that helps a person, group, or result.","example":"Everyone can contribute an idea.","family":["contribution","contributor"],"root":"contribute → contribution → contributor"},
"sustainable":{"pos":"adjective","zh":"可持续的；能够长期维持的。","meaning":"Able to continue for a long time without causing serious harm or using up resources.","example":"We need more sustainable ways to travel.","family":["sustain","sustainability","sustainably"],"root":"sustain → sustainable → sustainability"},
"abandon":{"pos":"verb","zh":"放弃；抛弃；离开。","meaning":"To leave something or stop doing something completely.","example":"They decided not to abandon the plan.","family":["abandoned","abandonment"],"root":"abandon → abandonment"},
"figure out":{"pos":"phrasal verb","zh":"弄明白；想出办法。","meaning":"To understand something or find a way to solve it.","example":"I finally figured out the answer.","family":["figure","figure it out"],"root":"固定短语：figure + out"},
"look forward to":{"pos":"expression","zh":"期待；盼望。","meaning":"To feel happy and excited about something that will happen.","example":"I look forward to seeing you.","family":["look forward","looking forward to"],"root":"固定表达，不按单个词直译。"},
"curious":{"pos":"adjective","zh":"好奇的；想了解的。","meaning":"Wanting to know or learn more about something.","example":"I'm curious about how it works.","family":["curiosity","curiously"],"root":"curious → curiosity"},
"confident":{"pos":"adjective","zh":"自信的；有把握的。","meaning":"Feeling sure about your ability or about something being true.","example":"She feels confident about the test.","family":["confidence","confidently"],"root":"confident → confidence"},
"challenge":{"pos":"noun / verb","zh":"挑战；对……提出挑战。","meaning":"Something difficult that tests your ability, or to test someone or something.","example":"Learning a new language is a challenge.","family":["challenging","challenger"],"root":"challenge → challenging"},
"discover":{"pos":"verb","zh":"发现；找到以前不知道的东西。","meaning":"To find or learn something for the first time.","example":"I discovered a useful new word.","family":["discovery","discoverable"],"root":"discover → discovery"},
"understand":{"pos":"verb","zh":"理解；明白。","meaning":"To know what something means or how it works.","example":"Do you understand the question?","family":["understanding","understood"],"root":"understand → understanding"},
"practice":{"pos":"noun / verb","zh":"练习；实践。","meaning":"Repeated activity done to improve a skill.","example":"Practice makes your English stronger.","family":["practise","practiced","practicing"],"root":"practice → practical（相关词）"},
"remember":{"pos":"verb","zh":"记得；记住。","meaning":"To keep something in your memory or bring it back to mind.","example":"I can't remember his name.","family":["remembered","remembering","reminder"],"root":"remember → reminder"},
"learn":{"pos":"verb","zh":"学习；学会。","meaning":"To gain knowledge or a skill through study or experience.","example":"I learn new words every day.","family":["learner","learning","learned"],"root":"learn → learner → learning"},
"example":{"pos":"noun","zh":"例子；示例。","meaning":"Something that shows what another thing is like or how it works.","example":"Can you give me an example?","family":["for example","example-based"],"root":"example → for example"},
"because":{"pos":"conjunction","zh":"因为；由于。","meaning":"For the reason that something happened or is true.","example":"I stayed home because it was raining.","family":["because of"],"root":"because → because of"},
"although":{"pos":"conjunction","zh":"虽然；尽管。","meaning":"Used to introduce a contrast.","example":"Although it was late, I kept studying.","family":["even though","though"],"root":"相关表达：though / even though"},
"actually":{"pos":"adverb","zh":"实际上；其实。","meaning":"Used to say what is really true, especially when it is different from what was expected.","example":"Actually, I don't agree.","family":["actual","actuality"],"root":"actual → actually"}
};

/* ================= Storage (V2, migrates V1) ================= */
const KEY_V2 = "wordnest_library_v3";
const KEY_V1 = "wordnest_library_v2";
const DAY = 86400000;

function newCard(term){
  return {term:term, addedAt:Date.now(), due:Date.now(), intervalDays:0, ease:2.5,
    reps:0, lapses:0, state:"new", lookups:0, correct:0, wrong:0, detail:null, unknown:false};
}
function loadLib(){
  try{
    const raw = localStorage.getItem(KEY_V2);
    if(raw) return JSON.parse(raw) || {};
    const old = localStorage.getItem(KEY_V1);
    if(old){
      const o = JSON.parse(old) || {}; const out = {};
      const daysByLevel = [0,1,3,7,14,30];
      for(const k of Object.keys(o)){
        const c = newCard(k); const v = o[k] || {};
        c.lookups = v.lookups||1; c.correct = v.correct||0; c.wrong = v.wrong||0;
        c.intervalDays = daysByLevel[Math.min(v.level||0,5)];
        c.due = v.next || Date.now();
        c.state = (v.level||0) > 0 ? "review" : "new";
        c.unknown = !!v.unknown;
        if(DICT[k]) c.detail = DICT[k];
        out[k] = c;
      }
      localStorage.setItem(KEY_V2, JSON.stringify(out));
      return out;
    }
    return {};
  }catch(e){ return {}; }
}
function saveLib(x){ localStorage.setItem(KEY_V2, JSON.stringify(x)); }
function ensureCard(lib, term){
  if(!lib[term]) lib[term] = newCard(term);
  return lib[term];
}

/* ================= SRS CORE START ================= */
function fmtInterval(days){
  if(days <= 0) return "10分钟";
  if(days < 1) return Math.round(days*24*60) + "分钟";
  if(days < 30) return (Math.round(days*10)/10) + "天";
  if(days < 365) return (Math.round(days/30*10)/10) + "个月";
  return (Math.round(days/365*10)/10) + "年";
}
function srsCalc(card, grade){
  const ease0 = card.ease || 2.5;
  const I = card.intervalDays || 0;
  if(grade === "again"){
    return {dueMs: Date.now() + 10*60*1000, intervalDays: 0,
      ease: Math.max(1.3, ease0 - 0.2), label: "10分钟"};
  }
  let days, ease = ease0;
  if(grade === "hard"){
    days = I === 0 ? 1 : Math.max(1, I * 1.2);
    ease = Math.max(1.3, ease0 - 0.15);
  }else if(grade === "good"){
    days = I === 0 ? 3 : I * ease0;
  }else{ /* easy */
    days = I === 0 ? 7 : I * ease0 * 1.3;
    ease = Math.min(2.8, ease0 + 0.15);
  }
  days = Math.round(days*10)/10;
  return {dueMs: Date.now() + days*DAY, intervalDays: days, ease: ease, label: fmtInterval(days)};
}
function applyGrade(card, grade){
  const r = srsCalc(card, grade);
  if(grade === "again"){ card.lapses = (card.lapses||0)+1; card.wrong = (card.wrong||0)+1; }
  if(grade === "good" || grade === "easy"){ card.correct = (card.correct||0)+1; }
  if(grade === "hard"){ card.wrong = (card.wrong||0)+1; }
  card.due = r.dueMs; card.intervalDays = r.intervalDays; card.ease = r.ease;
  card.reps = (card.reps||0)+1; card.state = grade === "again" ? "learning" : "review";
  card.lastGrade = grade; card.lastReview = Date.now();
  return r;
}
/* ================= SRS CORE END ================= */

function learningTerms(lib){
  const now = Date.now();
  return Object.keys(lib).filter(t => (lib[t].state || "new") === "learning" && (lib[t].due || 0) > now)
    .sort((a,b) => (lib[a].due||0) - (lib[b].due||0));
}
function reviewQueueTerms(lib){
  return dueTerms(lib).concat(learningTerms(lib));
}
function cardReviewable(c){
  if(!c) return false;
  const d = c.detail || {};
  if(d.meaning || d.zh) return true;
  /* cards already in the SRS cycle (incl. migrated ones) keep working */
  return (c.reps || 0) > 0 || c.state === "review" || c.state === "learning";
}
function dueTerms(lib, now){
  now = now || Date.now();
  return Object.keys(lib).filter(k => cardReviewable(lib[k]) && (!lib[k].due || lib[k].due <= now))
    .sort((a,b) => (lib[a].due||0) - (lib[b].due||0));
}
function norm(s){ return String(s||"").trim().toLowerCase().replace(/\s+/g," "); }
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function scrollToEl(el){ try{ if(el) el.scrollIntoView({behavior:"smooth"}); }catch(e){} }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(window.__toast);
  window.__toast = setTimeout(()=> t.style.display = "none", 2400);
}

/* ================= Pronunciation ================= */
let currentAudio = null;
function speak(text, audioUrl){
  text = String(text||"").trim(); if(!text) return;
  if(audioUrl){
    try{
      if(currentAudio){ currentAudio.pause(); }
      currentAudio = new Audio(audioUrl);
      currentAudio.play().catch(()=> speakTTS(text));
      return;
    }catch(e){ /* fall through */ }
  }
  speakTTS(text);
}
function autoSpeakOn(){ try{ return localStorage.getItem("wordnest_autospeak") !== "0"; }catch(e){ return true; } }
function speakTTS(text){
  if(!("speechSynthesis" in window)){ toast("这个浏览器不支持语音朗读"); return; }
  speechSynthesis.cancel();

/* ================= Online dictionary + translation ================= */
function findLocal(term){
  if(DICT[term]) return DICT[term];
  const noSpace = term.replace(/\s+/g,"");
  for(const k of Object.keys(DICT)){ if(k.replace(/\s+/g,"") === noSpace) return DICT[k]; }
  return null;
}
/* == RELATED CORE START == */
function hasCJK(t){ return /[\u4e00-\u9fff]/.test(String(t||"")); }
function spellingVariants(term){
  const out = new Set(); const w = String(term||"");
  for(let i = 0; i < w.length; i++) out.add(w.slice(0,i) + w.slice(i+1));         // delete one letter: borne -> bone/born/bore
  for(let i = 0; i + 1 < w.length; i++) out.add(w.slice(0,i) + w[i+1] + w[i] + w.slice(i+2)); // transpose
  out.delete(w);
  return Array.from(out).filter(v => v.length >= 3);
}
function mergeFamily(lists, term, cap){
  const seen = new Set([String(term||"").toLowerCase()]); const out = [];
  for(const list of lists){
    for(const w of (list||[])){
      const x = String(w||"").trim().toLowerCase();
      if(!x || seen.has(x) || !/^[a-z][a-z'-]*$/.test(x)) continue;
      seen.add(x); out.push(x);
      if(out.length >= (cap || 8)) return out;
    }
  }
  return out;
}
function lemmaCandidates(term){
  const map = {borne:"bear", born:"bear", went:"go", gone:"go", children:"child",
    men:"man", women:"woman", better:"good", best:"good", worse:"bad", mice:"mouse",
    geese:"goose", feet:"foot", teeth:"tooth", took:"take", gave:"give", saw:"see"};
  if(map[term]) return [map[term]];
  const out = [];
  if(/ies$/.test(term)) out.push(term.slice(0,-3) + "y");
  if(/[^aeiou]ing$/.test(term)){ const b = term.slice(0,-3); out.push(b, b + "e", b + b[b.length-1]); }
  if(/ed$/.test(term)){ const b = term.slice(0,-2); out.push(b, b + "e", term.slice(0,-1)); }
  if(/es$/.test(term)) out.push(term.slice(0,-2));
  if(/s$/.test(term) && term.length > 3) out.push(term.slice(0,-1));
  return Array.from(new Set(out.filter(x => x && x !== term)));
}
function simpleRootNote(term, lemma){
  if(lemma && lemma !== term) return term + " 是 " + lemma + " 的变形，先掌握原形 " + lemma + "。";
  const suf = [["tion","名词后缀：行为/状态"],["sion","名词后缀：行为/状态"],["ness","名词后缀：……的性质"],["ment","名词后缀：行为/结果"],["able","形容词后缀：能够……的"],["ible","形容词后缀：能够……的"],["ful","形容词后缀：充满……的"],["less","形容词后缀：没有……的"],["ous","形容词后缀：具有……性质的"],["ive","形容词后缀：有……倾向的"],["ly","副词后缀：以……方式地"]];
  for(const [p, note] of suf){ if(term.endsWith(p)) return "后缀 -" + p + "：" + note + "。"; }
  const pre = [["un","否定：不、未"],["re","再次；向后"],["pre","在……之前"],["dis","否定；分开"],["im","不（否定）"],["in","不；向内"],["over","过度；越过"],["under","在……之下；不足"],["trans","跨越；转移"],["inter","在……之间"]];
  for(const [p, note] of pre){ if(term.startsWith(p) && term.length > p.length + 2) return "前缀 " + p + "-：" + note + "。"; }
  return "";
}
/* == RELATED CORE END == */
async function fetchDictEntry(word){
  for(let attempt = 0; attempt < 2; attempt++){
    try{
      const r = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word));
      if(r.ok){
        const j = await r.json();
        const entries = Array.isArray(j) ? j : (j ? [j] : []);
        if(!entries.length) return null;
        /* The free dictionary sometimes puts a rare/proper-noun sense first
           (e.g. "revere" -> noun "A revers", the place-name pronunciation).
           Pick the meaning with the most definitions as the primary sense,
           keep the rest as secondary senses, and take the phonetic from the
           entry that owns the primary sense (prefer one paired with audio). */
        let best = null; const senses = []; const syns = new Set(); let audio = "";
        entries.forEach(e => {
          (e.phonetics||[]).forEach(p => { if(!audio && p.audio) audio = p.audio; });
          (e.meanings||[]).forEach(m => {
            (m.synonyms||[]).slice(0,5).forEach(x => syns.add(x));
            const defs = m.definitions || [];
            if(defs.length && senses.length < 4)
              senses.push({pos: m.partOfSpeech || "", def: defs[0].definition || ""});
            if(defs.length && (!best || defs.length > best.defCount))
              best = {entry: e, meaning: m, defCount: defs.length};
          });
        });
        if(!best) return null;
        const e = best.entry, m0 = best.meaning;
        const defs = m0.definitions || [];
        const d0 = defs.find(x => x.example) || defs[0] || {};
        const ph = e.phonetics || [];
        let phonetic = ((ph.find(p => p.text && p.audio) || ph.find(p => p.text) || {}).text) || e.phonetic || "";
        if(!phonetic){
          for(const en of entries){
            if(en.phonetic){ phonetic = en.phonetic; break; }
            const f = (en.phonetics||[]).find(p => p.text);
            if(f){ phonetic = f.text; break; }
          }
        }
        phonetic = sanitizePhonetic(phonetic);
        return {pos: m0.partOfSpeech || "", meaning: d0.definition || "", 
          example: d0.example || "", phonetic: phonetic,
          audio: audio, synonyms: Array.from(syns), senses: senses};
      }
    }catch(err){ /* retry once */ }
  }
  return null;
}
async function datamuseWords(query){
  try{
    const r = await fetch("https://api.datamuse.com/words?" + query);
    if(!r.ok) return [];
    const j = await r.json();
    return (j||[]).map(x => x.word).filter(Boolean);
  }catch(e){ return []; }
}
async function dictHasWord(word){
  try{
    const r = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word));
    return !!r.ok;
  }catch(e){ return false; }
}
async function fetchFamily(term, lemma, dictSynonyms){
  const jobs = [datamuseWords("sl=" + encodeURIComponent(term) + "&max=6")];
  const variants = spellingVariants(term).slice(0, 12);
  variants.forEach(v => jobs.push(datamuseWords("sp=" + encodeURIComponent(v) + "&max=1")));
  const results = await Promise.all(jobs);
  const slRaw = (results[0] || []).slice(0, 5);
  const slOk = await Promise.all(slRaw.map(x => dictHasWord(String(x).toLowerCase())));
  const soundLike = slRaw.filter((x, i) => slOk[i]);
  const spelling = [];
  variants.forEach((v, i) => { if((results[i+1]||[]).some(w => w.toLowerCase() === v)) spelling.push(v); });
  return mergeFamily([[lemma && lemma !== term ? lemma : ""], dictSynonyms || [], soundLike, spelling], term, 8);
}
function cleanTranslation(t){
  if(!t) return "";
  const s = String(t);
  if(/MYMEMORY WARNING|AVAILABLE FREE TRANSLATIONS|QUERY LENGTH LIMIT|INVALID EMAIL/i.test(s)) return "";
  return s.replace(/&quot;/g, '"').replace(/&#39;|&apos;/g, "'")
    .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&").trim();
}
function sanitizePhonetic(p){
  /* the IPA stress marks ˈ/ˌ render flipped or broken in some phone fonts */
  return String(p || "").replace(/ˈ/g, "'").replace(/ˌ/g, ",");
}
async function translateText(text, from, to){
  try{
    const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) +
      "&langpair=" + encodeURIComponent(from) + "|" + encodeURIComponent(to));
    if(!r.ok) return "";
    const j = await r.json();
    const t = cleanTranslation(j && j.responseData && j.responseData.translatedText || "");
    return t && t.toLowerCase() !== String(text).toLowerCase() ? t : "";
  }catch(e){ return ""; }
}
async function translateWord(term, pos){
  /* Bare-word translation can be hijacked by proper nouns in the free
     translation memory ("revere" -> 里维尔, the city). Asking with the
     part of speech ("to revere") disambiguates; also prefer matches
     with a decent quality score over quality-0 contributed entries. */
  const tries = [];
  if(pos && /verb/i.test(pos)) tries.push("to " + term);
  tries.push(term);
  for(const q of tries){
    try{
      const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(q) +
        "&langpair=en|zh-CN");
      if(!r.ok) continue;
      const j = await r.json();
      const cands = [];
      (j.matches || []).forEach(m => {
        const mt = cleanTranslation(m && m.translation || "");
        if(mt && hasCJK(mt) && mt.toLowerCase() !== q.toLowerCase())
          cands.push({t: mt, q: parseFloat(m.quality) || 0, m: parseFloat(m.match) || 0});
      });
      cands.sort((a, b) => (b.q - a.q) || (b.m - a.m));
      const good = cands.find(c => c.q >= 50);
      if(good) return good.t;
      const rd = cleanTranslation((j.responseData && j.responseData.translatedText) || "");
      if(rd && hasCJK(rd) && rd.toLowerCase() !== q.toLowerCase()) return rd;
      if(cands.length) return cands[0].t;
    }catch(e){ /* try next phrasing */ }
  }
  return "";
}
async function fetchOnline(term){
  let detail = null; let lemma = "";
  if(!/\s/.test(term)){
    let entry = await fetchDictEntry(term);
    if(!entry){
      for(const cand of lemmaCandidates(term)){
        entry = await fetchDictEntry(cand);
        if(entry){ lemma = cand; break; }
      }
    }
    if(entry){
      detail = {pos: entry.pos, zh: "", meaning: entry.meaning, example: entry.example,
        phonetic: entry.phonetic, audio: entry.audio, family: [], root: "", source: "online", synonyms: entry.synonyms,
        senses: entry.senses || [], v: 2};
      if(lemma) detail.lemma = lemma;
    }
    const fam = await fetchFamily(term, lemma, entry ? entry.synonyms : []);
    detail = detail || {pos:"", zh:"", meaning:"", example:"", family:[], root:"", source:"online", v:2};
    detail.family = mergeFamily([detail.family, fam], term, 8);
    detail.root = simpleRootNote(term, lemma);
  }else{
    detail = {pos:"", zh:"", meaning:"", example:"", family:[], root:"", source:"online", v:2};
  }
  const zh = /\s/.test(term) ? await translateText(term, "en", "zh-CN")
    : await translateWord(term, detail.pos || "");
  if(zh){ detail.zh = detail.zh || zh; }
  delete detail.synonyms;
  return (detail.meaning || detail.zh || (detail.family && detail.family.length)) ? detail : null;
}
function detailIncomplete(d){
  return !d || !d.meaning || !d.root || !d.family || d.family.length < 3;
}
function mergeAiDetail(d, ai){
  const out = Object.assign({}, d || {});
  out.zh = out.zh || ai.zh || "";
  out.meaning = out.meaning || ai.meaning || "";
  out.example = out.example || ai.example || "";
  out.pos = out.pos || ai.pos || "";
  out.root = ai.root || out.root || "";
  out.family = mergeFamily([out.family || [], ai.family || []], "", 8);
  out.source = "ai";
  return out;
}

  });
  if(!r.ok) throw new Error("AI 请求失败 (" + r.status + ")");
  const j = await r.json();
  const txt = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content || "";

async function glossFor(word){
  const local = findLocal(word);
  if(local && local.zh) return local.zh.split(/[；;]/)[0];
  const t = await translateText(word, "en", "zh-CN");
  return t ? t.split(/[；;]/)[0].slice(0, 12) : "";
}
async function enrichFamilyGloss(term, d){

  const gloss = Object.assign({}, d.familyGloss || {});
  const missing = fam.filter(x => !gloss[x]);
  if(!missing.length) return;
  await Promise.all(missing.map(async x => {
    try{ const g = await glossFor(x); if(g) gloss[x] = g; }catch(e){}
  }));
  if(!Object.keys(gloss).length) return;
  const lib = loadLib(); const card = lib[term];
  if(!card || !card.detail) return;
  card.detail.familyGloss = gloss; saveLib(lib);

async function search(termArg){

  const fromInput = typeof termArg !== "string";
  const rawInput = fromInput ? document.getElementById("q").value : termArg;
  if(fromInput && !hasCJK(rawInput) && rawInput.trim().split(/\s+/).filter(Boolean).length >= 4){
    const toks = buildTextTokens(rawInput.trim()).filter(t => /[A-Za-z]/.test(t.raw));
    if(toks.length >= 4){

    }
  }

  }

  const lib = loadLib();
  const card = ensureCard(lib, term);
  card.lookups = (card.lookups||0) + 1;

  const local = findLocal(term);
  if(local){
    card.detail = local; card.unknown = false; saveLib(lib);
    renderResult(term, local); refreshAll(); return;
  }
  if(card.detail && card.detail.meaning && (card.detail.v || 0) >= 2){
    saveLib(lib); renderResult(term, card.detail); refreshAll(); return;
  }
  const result = document.getElementById("result");
  result.innerHTML = '<div class="card"><span class="spin"></span>正在在线查询「' + escapeHtml(term) + '」…</div>';
  saveLib(lib);
  let online = await fetchOnline(term);
  const lib2 = loadLib(); const card2 = ensureCard(lib2, term);
  if(online && (online.meaning || online.zh)){
    const aiS = aiSettings();
    if(aiS.key && aiS.auto !== false && detailIncomplete(online)){
      result.innerHTML = '<div class="card"><span class="spin"></span>资料不完整，正在用 AI 补全…</div>';

      catch(e){ /* keep dictionary result */ }
      const lib3 = loadLib(); const card3 = ensureCard(lib3, term);
      card3.detail = online; card3.unknown = false; saveLib(lib3);
      renderResult(term, online); refreshAll(); return;
    }
    card2.detail = online; card2.unknown = false; saveLib(lib2);
    renderResult(term, online);
  }else if(card.detail && (card.detail.meaning || card.detail.zh)){

  }else{
    card2.unknown = true; saveLib(lib2);

      '<div><span class="word">' + escapeHtml(term) + '</span>' + speakBtn(term, "") + '</div>' +
      '<div class="zh">暂时没有查到这个词的资料</div>' +
      '<div class="meaning">离线词典里没有它，在线词典也没查到（可能没网，或它是非常用短语）。它已加入词库，你可以：</div>' +

      '</div></div>';

/* ================= Relation graph (kept from V1, clickable) ================= */
function drawGraph(g, term, family, glossMap){
  if(!g) return;
  g.innerHTML = "";
  const cx = 50, cy = 50;
  const list = (family||[]).slice(0,6);
  list.forEach((w, i) => {
    const a = (Math.PI*2*i/Math.max(1,list.length)) - Math.PI/2;
    const x = 50 + 35*Math.cos(a), y = 50 + 35*Math.sin(a);
    const dx = x-cx, dy = y-cy, len = Math.sqrt(dx*dx + dy*dy);
    const line = document.createElement("div");
    line.className = "line";
    line.style.left = cx + "%"; line.style.top = cy + "%";
    line.style.width = len + "%";
    line.style.transform = "rotate(" + (Math.atan2(dy,dx)*180/Math.PI) + "deg)";
    g.appendChild(line);
    const n = document.createElement("div");
    n.className = "node";
    const gl = (glossMap || {})[w];
    n.innerHTML = escapeHtml(w) + (gl ? '<span class="gl">' + escapeHtml(gl) + '</span>' : '');
    n.style.left = "calc(" + x + "% - 30px)"; n.style.top = "calc(" + y + "% - 18px)";
    n.addEventListener("click", ()=> search(w));
    g.appendChild(n);
  });
  const c = document.createElement("div");
  c.className = "node"; c.textContent = term;
  c.style.left = "calc(50% - 35px)"; c.style.top = "calc(50% - 18px)";
  c.style.background = "#18202a"; c.style.color = "white";
  g.appendChild(c);
}

/* ================= Anki-style flashcard session ================= */
let session = null; /* {queue:[], total:0, done:0, stats:{again,hard,good,easy}, current:null, showing:false} */
let undoState = null; /* {term, prev, grade, sessionRef, statsBefore, doneBefore, totalBefore} */
function capNewCards(queue, lib){
  const fresh = [], rest = [];
  queue.forEach(t => {
    const c = lib[t] || {};
    if((c.state || "new") === "new" && !(c.reps || 0)) fresh.push(t); else rest.push(t);
  });
  return rest.concat(fresh.slice(0, 20));
}
function startReview(onlyTerm){
  const lib = loadLib();
  undoState = null;
  let queue;
  if(onlyTerm){ queue = [onlyTerm]; }
  else{ queue = capNewCards(Array.from(new Set(reviewQueueTerms(lib))), lib); }
  if(!queue.length){
    switchTab("review");
    document.getElementById("session").innerHTML =
      '<div class="card empty">今天没有到期的卡片 🎉<br><br>去查询新词，它们会自动变成闪卡。</div>';
    return;
  }
  session = {queue: queue.slice(), total: queue.length, done: 0,
    stats: {again:0, hard:0, good:0, easy:0}, current: null, showing: false, requeued: {}};
  switchTab("review");
  nextCard();
}
function nextCard(){
  const el = document.getElementById("session");
  if(!session || !session.queue.length){
    const s = session ? session.stats : {again:0, hard:0, good:0, easy:0};
    const total = session ? session.total : 0;
    const remain = reviewQueueTerms(loadLib()).length;
    el.innerHTML = '<div class="card fc"><div style="font-size:44px">🎉</div>' +
      '<h2>本轮复习完成</h2>' +

  session.showing = false;

}
function progressHtml(){

function gradeCurrent(grade){
  if(!session || !session.current) return;
  const term = session.current;
  const lib = loadLib(); const card = ensureCard(lib, term);
  if(!card.detail){ const local = findLocal(term); if(local) card.detail = local; }
  const prev = {};
  ["due","intervalDays","ease","reps","lapses","state","correct","wrong","lastGrade","lastReview"]
    .forEach(k => { prev[k] = card[k]; });
  undoState = {term: term, prev: prev, grade: grade, sessionRef: session,
    statsBefore: Object.assign({}, session.stats), doneBefore: session.done, totalBefore: session.total};
  applyGrade(card, grade); saveLib(lib);
  session.stats[grade]++; session.done++;
  /* Again cards are scheduled +10min and stay counted as pending (badge),
     but no longer repeat inside this session — review goes straight through. */
  session.current = null;
  nextCard(); /* counts refresh once at session end (in nextCard), not per card */
}

/* ================= Photo + crop + OCR ================= */
const crop = {x: 0.1, y: 0.2, w: 0.8, h: 0.35}; /* fractions of displayed image */
function layoutCropBox(){
  const wrap = document.getElementById("cropWrap");
  const box = document.getElementById("cropBox");
  const W = wrap.clientWidth, H = wrap.clientHeight;
  box.style.left = (crop.x*W) + "px"; box.style.top = (crop.y*H) + "px";
  box.style.width = (crop.w*W) + "px"; box.style.height = (crop.h*H) + "px";
}
function initCropDrag(){
  const wrap = document.getElementById("cropWrap");
  const box = document.getElementById("cropBox");
  const handle = document.getElementById("cropHandle");
  let drag = null;
  function pos(e){ const r = wrap.getBoundingClientRect(); return {px: e.clientX - r.left, py: e.clientY - r.top, W: r.width, H: r.height}; }
  box.addEventListener("pointerdown", e => {
    if(e.target === handle) return;
    drag = {mode: "move", dx: e.clientX, dy: e.clientY, start: Object.assign({}, crop)};
    box.setPointerCapture(e.pointerId); e.preventDefault();
  });
  handle.addEventListener("pointerdown", e => {
    drag = {mode: "resize", dx: e.clientX, dy: e.clientY, start: Object.assign({}, crop)};
    handle.setPointerCapture(e.pointerId); e.preventDefault(); e.stopPropagation();
  });
  window.addEventListener("pointermove", e => {
    if(!drag) return;
    const r = wrap.getBoundingClientRect();
    const ddx = (e.clientX - drag.dx)/r.width, ddy = (e.clientY - drag.dy)/r.height;
    if(drag.mode === "move"){
      crop.x = Math.min(1 - crop.w, Math.max(0, drag.start.x + ddx));
      crop.y = Math.min(1 - crop.h, Math.max(0, drag.start.y + ddy));
    }else{
      crop.w = Math.min(1 - crop.x, Math.max(0.15, drag.start.w + ddx));
      crop.h = Math.min(1 - crop.y, Math.max(0.1, drag.start.h + ddy));
    }
    layoutCropBox();
  });
  window.addEventListener("pointerup", ()=> drag = null);
  window.addEventListener("resize", layoutCropBox);
}
let tesseractLoading = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoading) return tesseractLoading;
  tesseractLoading = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js";
    s.onload = res; s.onerror = ()=> rej(new Error("OCR 引擎加载失败，请检查网络"));
    document.head.appendChild(s);
  });
  return tesseractLoading;
}
async function runOCR(){
  const img = document.getElementById("cropImg");
  const status = document.getElementById("ocrStatus");
  const out = document.getElementById("ocrResult");
  if(!img.naturalWidth){ toast("先拍照或选一张图"); return; }
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(img.naturalWidth * crop.w);
  canvas.height = Math.round(img.naturalHeight * crop.h);
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, img.naturalWidth*crop.x, img.naturalHeight*crop.y,
    img.naturalWidth*crop.w, img.naturalHeight*crop.h, 0, 0, canvas.width, canvas.height);
  /* Print-friendly copy for recognition: fade light marks (pencil underlines,
     faint handwriting) to white so the engine mostly sees printed text.
     The original canvas is kept untouched for mark detection. */
  const ocrCanvas = document.createElement("canvas");
  ocrCanvas.width = canvas.width; ocrCanvas.height = canvas.height;
  const octx = ocrCanvas.getContext("2d");
  octx.drawImage(canvas, 0, 0);
  try{
    const idata = octx.getImageData(0, 0, ocrCanvas.width, ocrCanvas.height);
    const px = idata.data;
    for(let i = 0; i < px.length; i += 4){
      const lum = 0.299*px[i] + 0.587*px[i+1] + 0.114*px[i+2];
      const v = lum <= 40 ? 0 : (lum >= 175 ? 255 : Math.round((lum - 40) * 255 / 135));
      px[i] = px[i+1] = px[i+2] = v;
    }
    octx.putImageData(idata, 0, 0);
  }catch(e){ /* fall back to the raw crop */ }
  status.innerHTML = '<span class="spin"></span>正在加载 OCR 引擎并识别框选区域…';
  out.innerHTML = "";
  try{
    await loadTesseract();
    const res = await Tesseract.recognize(ocrCanvas, "eng", {
      logger: m => { if(m.status === "recognizing text") status.innerHTML = '<span class="spin"></span>识别中 ' + Math.round((m.progress||0)*100) + "%…"; }
    });
    let words = (res.data && res.data.words) || [];
    if(!words.length && res.data){
      (res.data.blocks||[]).forEach(b => (b.paragraphs||[]).forEach(p => (p.lines||[]).forEach(l => (l.words||[]).forEach(w => words.push(w)))));
    }
    let tokens;
    if(words.length){
      tokens = buildOcrTokens(words);
      try{ analyzeMarks(canvas, tokens); }catch(e){ /* analysis is best-effort */ }
    }else{
      tokens = buildTextTokens((res.data && res.data.text) || "");
    }
    const withLetters = tokens.filter(t => /[A-Za-z]/.test(t.raw));
    tokens = withLetters.filter(t => t.conf === null || t.conf === undefined || t.conf >= 30);
    const ignored = withLetters.length - tokens.length;
    if(!tokens.length){ status.textContent = "框选区域里没有识别到英文，试着框紧一点、光线好一点。"; return; }
    const pre = tokens.filter(t => t.selected).length;
    status.textContent = "识别完成：共 " + tokens.length + " 个词，机器预选了 " + pre + " 个疑似被标记的词" +
      (ignored ? "，已自动忽略 " + ignored + " 个低置信度词（多为手写或污渍）" : "") +
      "。点词选中/取消，选中后自动翻译；分开点取各自成卡，同行连选合成一张短语卡。";
    setupCapture(out, tokens, "photo");
  }catch(err){
    status.textContent = String(err && err.message || err);
  }
}

/* ================= Capture: tokens, sentences, mark detection ================= */
/* == CAPTURE CORE START == */
function cleanTerm(raw){
  return String(raw||"").replace(/^[^A-Za-z']+|[^A-Za-z']+$/g,"").toLowerCase();
}
function splitSentenceRanges(text){
  const ranges = []; let start = 0;
  const re = /[^.!?。！？]+[.!?。！？]+["')\]]*\s*|[^.!?。！？]+$/g; let m;
  while((m = re.exec(text)) !== null){
    if(m[0].trim()) ranges.push({start: m.index, end: m.index + m[0].length, text: m[0].trim()});
    if(re.lastIndex === m.index) re.lastIndex++;
  }
  if(!ranges.length && text.trim()) ranges.push({start:0, end:text.length, text:text.trim()});
  return ranges;
}
function assignSentences(tokens){
  /* tokens: [{raw, offset}] in reading order; joins with single spaces */
  const text = tokens.map(t => t.raw).join(" ");
  const ranges = splitSentenceRanges(text);
  let pos = 0;
  const withOff = tokens.map(t => { const o = pos; pos += t.raw.length + 1; return o; });
  tokens.forEach((t, i) => {
    const mid = withOff[i] + t.raw.length/2;
    let si = ranges.findIndex(r => mid >= r.start && mid < r.end);
    if(si < 0) si = ranges.length - 1;
    t.sentenceIdx = Math.max(0, si);
  });
  return ranges.map(r => r.text);
}
function computeGroups(tokens, splitSet){
  const groups = []; let cur = null;
  tokens.forEach((t, i) => {
    if(t.selected){
      const prev = cur ? cur.indices[cur.indices.length - 1] : -1;
      if(cur && !splitSet.has(i) && prev === i - 1 && (tokens[prev].line || 0) === (t.line || 0)){ cur.indices.push(i); }
      else{ cur = {indices:[i], start:i}; groups.push(cur); }
    }else cur = null;
  });
  groups.forEach(g => {
    g.text = g.indices.map(i => cleanTerm(tokens[i].raw)).filter(Boolean).join(" ");
    g.sentence = tokens[g.indices[0]].sentenceText || "";
  });
  return groups.filter(g => g.text);
}
/* == CAPTURE CORE END == */
function buildTextTokens(text){
  const tokens = [];
  String(text||"").split(/\n/).forEach((lineText, li) => {
    lineText.trim().split(/\s+/).filter(Boolean).forEach(r =>
      tokens.push({raw: r, selected: false, mark: null, line: li}));
  });
  const sentences = assignSentences(tokens);
  tokens.forEach(t => t.sentenceText = sentences[t.sentenceIdx] || "");
  return tokens;
}
function buildOcrTokens(words){
  const items = words.filter(w => w && w.text && w.bbox).map(w => ({
    raw: String(w.text).trim(), bbox: w.bbox, selected: false, mark: null, conf: (typeof w.confidence === "number" ? w.confidence : null)
  })).filter(t => t.raw);
  /* cluster into lines by vertical overlap, then sort by x */
  items.sort((a,b) => (a.bbox.y0 - b.bbox.y0) || (a.bbox.x0 - b.bbox.x0));
  const lines = [];
  items.forEach(t => {
    const h = t.bbox.y1 - t.bbox.y0, cy = (t.bbox.y0 + t.bbox.y1)/2;
    let line = lines.find(l => Math.abs(l.cy - cy) < Math.max(8, h*0.6));
    if(!line){ line = {cy: cy, items: []}; lines.push(line); }
    line.items.push(t); line.cy = (line.cy*(line.items.length-1) + cy)/line.items.length;
  });
  lines.sort((a,b) => a.cy - b.cy);
  const tokens = [];
  lines.forEach((l, li) => { l.items.sort((a,b) => a.bbox.x0 - b.bbox.x0);
    l.items.forEach(t => { t.line = li; tokens.push(t); }); });
  const sentences = assignSentences(tokens);
  tokens.forEach(t => t.sentenceText = sentences[t.sentenceIdx] || "");
  return tokens;
}
function chromaOf(r,g,b){ return Math.max(r,g,b) - Math.min(r,g,b); }
function analyzeMarks(canvas, tokens){
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const data = ctx.getImageData(0, 0, W, H).data;
  function px(x, y){
    x = Math.max(0, Math.min(W-1, x|0)); y = Math.max(0, Math.min(H-1, y|0));
    const i = (y*W + x)*4; return [data[i], data[i+1], data[i+2]];
  }
  function fillRatio(x0,y0,x1,y1){
    let sat = 0, tot = 0;
    const step = Math.max(1, Math.floor(Math.min(x1-x0, y1-y0)/18)) || 1;
    for(let y = y0; y < y1; y += step) for(let x = x0; x < x1; x += step){
      const [r,g,b] = px(x,y); if((r+g+b)/3 < 110) continue;
      tot++; if(chromaOf(r,g,b) > 50) sat++;
    }
    return tot ? sat/tot : 0;
  }
  function stripMaxRow(x0,y0,x1,y1){
    let best = 0;
    for(let y = y0; y < y1; y++){
      let sat = 0, tot = 0;
      const step = Math.max(1, Math.floor((x1-x0)/40)) || 1;
      for(let x = x0; x < x1; x += step){
        const [r,g,b] = px(x,y); tot++;
        if(chromaOf(r,g,b) > 50 && (r+g+b)/3 > 80) sat++;
      }
      if(tot) best = Math.max(best, sat/tot);
    }
    return best;
  }
  tokens.forEach(t => {
    if(!t.bbox) return;
    const {x0,y0,x1,y1} = t.bbox; const h = Math.max(6, y1-y0);
    const fill = fillRatio(x0, y0, x1, y1);
    const lineBelow = stripMaxRow(x0, y1+2, x1, Math.min(H, y1 + h*0.7));
    const lineAbove = stripMaxRow(x0, Math.max(0, y0 - h*0.7), x1, Math.max(1, y0-2));
    const border = Math.max(lineAbove, lineBelow);
    t.mark = {fill: Math.round(fill*100)/100, line: Math.round(Math.max(lineBelow,0)*100)/100, border: Math.round(border*100)/100};
    t.selected = fill > 0.22 || lineBelow > 0.45 || border > 0.55;
  });
}

/* ================= Capture confirm UI ================= */
let captureState = null;
function closeCaptureTask(){
  captureState = null;
  const or = document.getElementById("ocrResult"); if(or) or.innerHTML = "";
  const os = document.getElementById("ocrStatus"); if(os) os.textContent = "";
  const op = document.getElementById("ocrPanel"); if(op) op.classList.add("hidden");
  const ca = document.getElementById("captureArea"); if(ca) ca.innerHTML = "";
  const cp2 = document.getElementById("capturePanel"); if(cp2) cp2.classList.add("hidden");
  const fi = document.getElementById("photoInput"); if(fi) fi.value = "";
  const ci = document.getElementById("cropImg"); if(ci) ci.removeAttribute("src");
}
function setupCapture(container, tokens, kind){
  captureState = {container: container, tokens: tokens, splitSet: new Set(), kind: kind, trans: {}, source: ""};
  renderCapture();
}
function renderCapture(){
  const st = captureState; if(!st) return;
  const srcEl = document.getElementById("capSource");
  if(srcEl) st.source = srcEl.value;
  const tokens = st.tokens;
  const selCount = tokens.filter(t => t.selected).length;
  const groups = computeGroups(tokens, st.splitSet);
  const spanHtml = i => {
    const t = tokens[i];
    return '<span class="tok' + (t.selected ? " sel" : "") +
      '" data-action="cap-tok" data-i="' + i + '">' + escapeHtml(t.raw) + '</span>';
  };
  const lineMap = new Map();
  tokens.forEach((t, i) => { const L = t.line || 0; if(!lineMap.has(L)) lineMap.set(L, []); lineMap.get(L).push(i); });
  const linesHtml = Array.from(lineMap.entries()).sort((x,y) => x[0]-y[0])
    .map(([L, idxs]) => '<div class="capline">' + idxs.map(spanHtml).join(" ") + '</div>').join("");
  st.container.innerHTML =
    '<div class="captext">' + linesHtml + '</div>' +
    '<div class="small" style="margin-top:8px">已选 ' + selCount + ' 词 → ' + groups.length + ' 张卡（分开点取 = 各自一张卡；同行连选 = 一张短语卡）</div>' +
    '<div style="margin-top:8px"><button class="secondary" data-action="cap-lookup-all">🔍 直接查这整段（当作一个词条）</button></div>' +
    '<div class="field"><label>来源（可选）</label><input id="capSource" placeholder="如：马太福音 5章" value="' + escapeHtml(st.source || "") + '"></div>' +
    '<div id="capGroups"></div>' +
    '<div class="actions"><button data-action="cap-confirm" ' + (groups.length ? "" : "disabled") + '>🃏 直接做成闪卡（' + groups.length + '）</button></div>';
  renderCapGroups();
  ensureCapTranslations();
}
function renderCapGroups(){
  const st = captureState; if(!st) return;
  const el = document.getElementById("capGroups"); if(!el) return;
  const tokens = st.tokens;
  const groups = computeGroups(tokens, st.splitSet);
  const lineTextOf = li => tokens.filter(t => (t.line || 0) === li).map(t => t.raw).join(" ");
  el.innerHTML = groups.length ? groups.map(g => {
    const tr = (st.trans || {})[g.text];
    const zh = (tr === undefined || tr === null) ? '<div class="small">翻译中…</div>'
      : (tr ? '<div class="capzh">' + escapeHtml(tr) + '</div>'
            : '<div class="small">（暂无翻译，确认后会再查）</div>');
    return '<div class="item"><div><b>' + escapeHtml(g.text) + '</b>' +
      '<span class="small"> ' + (g.indices.length > 1 ? '· 短语' : '· 单词') + '</span>' + zh +
      '<div class="small">' + escapeHtml(lineTextOf(tokens[g.start].line || 0)) + '</div></div>' +
      (g.indices.length > 1 ? '<button class="secondary" data-action="cap-split" data-start="' + g.start + '">拆开</button>' : '') +
      '</div>';
  }).join("") : '<div class="small">点词选中，选中后自动翻译。</div>';
}
async function ensureCapTranslations(){
  const st = captureState; if(!st) return;
  st.trans = st.trans || {};
  const groups = computeGroups(st.tokens, st.splitSet);
  const todo = groups.filter(g => st.trans[g.text] === undefined);
  if(!todo.length) return;
  todo.forEach(g => { st.trans[g.text] = null; });
  renderCapGroups();
  for(const g of todo){
    let zh = "";
    try{ zh = await translateText(g.text, "en", "zh-CN"); }catch(e){}
    if(captureState !== st) return;
    st.trans[g.text] = zh || "";
    renderCapGroups();
  }
}

/* ================= Voice recognition input ================= */
let recognizer = null;
function startVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast("这个浏览器不支持语音识别，试试 Chrome / Edge"); return; }
  if(recognizer){ try{ recognizer.stop(); }catch(e){} recognizer = null; return; }
  recognizer = new SR();
  recognizer.lang = "en-US"; recognizer.interimResults = true;
  const btn = document.getElementById("micBtn");
  recognizer.onresult = e => {
    let txt = "";
    for(const r of e.results) txt += r[0].transcript;
    document.getElementById("q").value = txt.trim();
    if(e.results[e.results.length-1].isFinal){ search(); }
  };
  recognizer.onend = ()=> { btn.classList.remove("recording"); btn.textContent = "🎤"; recognizer = null; };
  recognizer.onerror = e => { toast("语音识别出错：" + (e.error||"")); };
  btn.classList.add("recording"); btn.textContent = "⏺";
  toast("请说出英文单词或短语…");
  try{ recognizer.start(); }catch(e){ toast("无法启动麦克风"); }
}

/* ================= Tabs & global actions ================= */
function switchTab(name){
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x.dataset.tab === name));
  const nm = document.getElementById("navMore");
  if(nm) nm.classList.toggle("active", name === "library" || name === "settings");
  ["search","review","library","settings"].forEach(id =>
    document.getElementById(id + "Tab").classList.toggle("hidden", id !== name));
  const cpX = document.getElementById("capturePanel");
  if(cpX){
    if(name === "search" && captureState && captureState.kind === "paste") cpX.classList.remove("hidden");
    else if(name !== "search") cpX.classList.add("hidden");
  }
  const opX = document.getElementById("ocrPanel");
  if(opX && name !== "search") opX.classList.add("hidden");
  if(name === "library") renderLibrary();
  if(name === "review" && !session){
    const libR = loadLib();
    const q2 = reviewQueueTerms(libR);
    if(q2.length){
      const qu = capNewCards(Array.from(new Set(q2)), libR);
      undoState = null;
      session = {queue: qu.slice(), total: qu.length, done: 0,
        stats: {again:0, hard:0, good:0, easy:0}, current: null, showing: false, requeued: {}};
      nextCard();
    }else{
      document.getElementById("session").innerHTML =
        '<div class="card empty">今天没有待复习的卡片 🎉</div>';
    }
  }
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if(!el) return;
  const a = el.dataset.action, term = el.dataset.term;
  if(a === "speak") speak(el.dataset.text, el.dataset.audio || "");
  else if(a === "lookup") search(term);
  else if(a === "start-review") startReview();
  else if(a === "start-review-one") startReview(term);
  else if(a === "show-answer"){ if(session){ session.showing = true; renderCardBack(); } }
  else if(a === "grade") gradeCurrent(el.dataset.grade);
  else if(a === "undo-grade"){
    const u = undoState;
    if(u){
      const libU = loadLib(); const cU = ensureCard(libU, u.term);
      Object.assign(cU, u.prev); saveLib(libU);
      undoState = null;
      if(session && u.sessionRef === session){
        if(session.current) session.queue.unshift(session.current);
        session.current = u.term; session.showing = false;
        session.done = u.doneBefore; session.stats = u.statsBefore; session.total = u.totalBefore;
        renderCardFront();
      }else{
        session = {queue: [], total: u.totalBefore, done: u.doneBefore,
          stats: u.statsBefore, current: u.term, showing: false, requeued: {}};
        switchTab("review");
        renderCardFront();
      }
      refreshAll(); toast("已撤销上一张评分");
    }
  }
  else if(a === "goto-search") switchTab("search");
  else if(a === "lookup-term"){
    const t = el.dataset.term;
    if(t){ document.getElementById("q").value = t; switchTab("search"); search(t); }
  }
  else if(a === "remove"){
    const lib = loadLib(); delete lib[term]; saveLib(lib); refreshAll(); renderLibrary(); toast("已删除");
  }
  else if(a === "ai-deep"){
    el.disabled = true; el.textContent = "✨ AI 查询中…";
    aiLookup(term).then(d => {
      if(d){
        const lib = loadLib(); const c = ensureCard(lib, term);
        c.detail = d; c.unknown = false; saveLib(lib);
        renderResult(term, d); refreshAll(); toast("AI 资料已生成并存入词库");
      }
    }).catch(err => toast(String(err.message||err))).finally(()=> { el.disabled = false; });
  }
  else if(a === "cap-lookup-all"){
    if(captureState){
      const phrase = captureState.tokens.map(t => cleanTerm(t.raw)).filter(Boolean).join(" ");
      closeCaptureTask();
      if(phrase){ switchTab("search"); search(phrase); }
    }
  }
  else if(a === "cap-tok"){
    const i = +el.dataset.i;
    if(captureState){ captureState.tokens[i].selected = !captureState.tokens[i].selected; renderCapture(); }
  }
  else if(a === "cap-split"){
    if(captureState){
      const g = computeGroups(captureState.tokens, captureState.splitSet).find(x => x.start === +el.dataset.start);
      if(g) g.indices.slice(1).forEach(idx => captureState.splitSet.add(idx));
      renderCapture();
    }
  }
  else if(a === "cap-confirm"){
    if(captureState){
      const srcEl = document.getElementById("capSource");
      const src = srcEl ? srcEl.value.trim() : "";
      const groups = computeGroups(captureState.tokens, captureState.splitSet);
      const batchId = Date.now();
      const lib = loadLib(); const terms = groups.map(g => g.text);
      groups.forEach(g => {
        const c = ensureCard(lib, g.text);
        c.detail = Object.assign({}, c.detail || {});
        const capZh = (captureState.trans || {})[g.text];
        if(capZh && !c.detail.zh) c.detail.zh = capZh;
        c.detail.contextWords = terms.slice();
        c.detail.contextSentence = "";
        c.detail.source = src;
        c.batch = batchId;
      });
      saveLib(lib);
      window.__lastBatch = terms;
      closeCaptureTask();
      toast("✅ 已生成 " + terms.length + " 张闪卡，已加入复习");
      refreshAll();
      (async () => {
        let done = 0;
        const enrichOne = async (term) => {
          try{
            const lib2 = loadLib(); const card = ensureCard(lib2, term);
            const cw = (card.detail && card.detail.contextWords) || null;
            const srcv = (card.detail && card.detail.source) || "";
            let d = findLocal(term) || card.detail;
            if(!findLocal(term) && (!d || !d.meaning || (d.v || 0) < 2)){
              const on = await fetchOnline(term);
              if(on) d = on;
            }
            if(d){
              const aiS = aiSettings();
              if(aiS.key && aiS.auto !== false && detailIncomplete(d)){
                try{ const ai = await aiLookup(term); if(ai) d = mergeAiDetail(d, ai); }catch(e){}
              }
              d = Object.assign({}, d);
              if(cw) d.contextWords = cw;
              d.contextSentence = "";
              d.source = srcv;
              card.detail = d; card.unknown = false; saveLib(lib2);
            }
          }catch(e){}
          done++;
          const p = document.getElementById("enrichProg");
          if(p) p.textContent = done < terms.length ? "（补全释义 " + done + "/" + terms.length + "）" : "（释义已补全）";
        };
        for(let i = 0; i < terms.length; i += 3){
          await Promise.all(terms.slice(i, i + 3).map(enrichOne));
        }
        refreshAll();
      })();
    }
  }
  else if(a === "ocr-all"){
    const words = (el.dataset.words||"").split(",").filter(Boolean);
    const lib = loadLib();
    words.forEach(w => { const c = ensureCard(lib, w); const l = findLocal(w); if(l) c.detail = l; });
    saveLib(lib); refreshAll();
    session = {queue: words.slice(), total: words.length, done: 0,
      stats: {again:0, hard:0, good:0, easy:0}, current: null, showing: false, requeued: {}};
    switchTab("review"); nextCard();
    toast("已把 " + words.length + " 个词做成闪卡");
  }
});
document.querySelectorAll("nav button[data-tab]").forEach(b =>
  b.addEventListener("click", ()=> switchTab(b.dataset.tab)));
document.getElementById("navMore").addEventListener("click", ()=>
  document.getElementById("moreMenu").classList.toggle("hidden"));
document.querySelectorAll("#moreMenu button").forEach(b =>
  b.addEventListener("click", ()=>{ document.getElementById("moreMenu").classList.add("hidden"); switchTab(b.dataset.menu); }));
document.getElementById("searchBtn").addEventListener("click", ()=> search());
document.getElementById("q").addEventListener("keydown", e => { if(e.key === "Enter") search(); });
document.getElementById("q").addEventListener("input", e => { e.target.classList.remove("searched"); });

});

  initCropDrag();

  renderHistory();
})();
