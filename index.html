<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WordNest">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<title>WordNest V3.6.2 — English Learning</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:'Space Mono','Sarasa Mono SC',ui-monospace,'SF Mono',Menlo,'PingFang SC','Helvetica Neue',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit}
.app{max-width:720px;margin:auto;min-height:100vh;padding:14px 16px 112px}
.lastrow{display:flex;justify-content:space-between;align-items:center;margin:16px 0 4px;position:relative}
.lastlabel{font-size:12px;color:#8a8a8a;letter-spacing:.14em}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:700}
h3.sec{font-size:13px;font-weight:700;margin:0 0 10px}
.gearbtn{background:none;border:none;color:#111;font-size:22px;padding:6px;cursor:pointer;line-height:0;border-radius:50%}
.gearbtn.active{background:#f0f0f0}
#moreMenu{position:absolute;right:0;top:44px;background:#fff;border:1px solid #e3e3e3;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.12);width:176px;z-index:60;overflow:hidden}
#moreMenu button{display:block;width:100%;text-align:left;padding:14px 18px;background:#fff;border:none;border-bottom:1px solid #f0f0f0;font-size:14.5px;cursor:pointer;color:#111;font-weight:400;border-radius:0}
#moreMenu button:last-child{border-bottom:none}
#moreMenu button:active{background:#f5f5f5}
.search{display:flex;gap:8px;background:#f4f4f4;padding:8px;border-radius:999px;align-items:center}
input{flex:1;border:0;outline:0;font-size:16px;min-width:0;padding:8px 10px;background:transparent;color:#111}
button{border:0;border-radius:999px;padding:12px 18px;font-weight:700;font-size:15px;background:#020202;color:#fff;cursor:pointer}
button.secondary{background:#f0f0f0;color:#111}
button:disabled{opacity:.4;cursor:default}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ececec;display:flex;justify-content:space-around;align-items:flex-start;padding:10px 0 calc(12px + env(safe-area-inset-bottom));z-index:40}
nav button{background:none;border:none;cursor:pointer;color:#111;display:flex;align-items:center;justify-content:center;padding:2px 10px}
nav button .ico{position:relative;width:47px;height:47px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
nav button.active .ico{background:#111;color:#fff}
.badge{position:absolute;top:-5px;right:-11px;background:#111;color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:2.5px 6px;min-width:21px;text-align:center;border:2px solid #fff}
.card{background:#fff;border:1px solid #ececec;border-radius:16px;padding:18px;margin:12px 0}
.detail{padding:4px 2px}
.word{font-size:34px;font-weight:800;margin:0 0 5px;word-break:break-word;letter-spacing:-.01em}
.pos{color:#111;font-weight:700;font-size:14px}
.phonetic{color:#8a8a8a;font-size:14px;font-weight:400}
.zh{font-size:15px;font-weight:700;margin:12px 0 4px;line-height:1.75}
.meaning{line-height:1.75;color:#111;font-size:15px}
.example{background:#f4f4f4;padding:16px 18px;border-radius:14px;margin-top:12px;line-height:1.7;font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{background:#fff;border:1px solid #dcdcdc;color:#111;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.actions button{flex:1;min-width:120px}
.empty{text-align:center;color:#8a8a8a;padding:45px 15px}
.hidden{display:none!important}
.item{padding:13px 0;border-bottom:1px solid #edf0f3;display:flex;align-items:center;justify-content:space-between;gap:10px}
.item:last-child{border-bottom:0}
.item b{font-size:16px}
.small{font-size:13px;color:#8a8a8a}
.graph{height:300px;background:#f7f7f7;border-radius:12px;position:relative;overflow:hidden;margin-top:10px}
.node{position:absolute;padding:9px 12px;border-radius:999px;background:#fff;border:1px solid #ddd;font-weight:700;font-size:14px;cursor:pointer}
.line{position:absolute;height:2px;background:#ddd;transform-origin:0 50%}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:11px 20px;border-radius:999px;display:none;z-index:50;max-width:90%;text-align:center;font-size:13.5px}
footer{text-align:center;color:#9a9a9a;font-size:12px;margin-top:25px;line-height:1.5}
.stats{display:flex;gap:10px;margin:12px 0}
.stat{flex:1;background:#fff;border-radius:16px;padding:14px 10px;text-align:center;border:1px solid #ececec}
.stat .num{font-size:28px;font-weight:800}
.stat .num.due{color:#111}
.stat .lbl{font-size:12px;color:#8a8a8a;margin-top:2px}
.iconbtn{flex:0 0 auto;width:42px;height:42px;border-radius:50%;padding:0;font-size:19px;background:transparent;color:#111}
.iconbtn:active{background:#e6e6e6}
.speakbtn{background:#fff;border:1.5px solid #111;color:#111;border-radius:50%;width:32px;height:32px;padding:0;font-size:14px;vertical-align:middle;margin-left:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.speakbtn:active{background:#111;color:#fff}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{flex:1}
.fc{text-align:center;padding:10px 6px}
.fc .fcword{font-size:31px;font-weight:800;word-break:break-word;margin:16px 0 4px;letter-spacing:-.01em}
.fc .hint{color:#8a8a8a;font-size:12.5px;margin-top:14px}
.revcard{background:#f5f5f5;border:1px solid #e7e7e7;border-radius:20px}
.sent{font-size:17px;line-height:1.85;text-align:left}
.senthl{font-weight:800;border-bottom:2.5px solid #111}
.progress{height:6px;background:#e7e7e7;border-radius:99px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:#111;border-radius:99px;transition:width .3s}
.flipbtn{display:block;margin:14px auto 0;background:none;border:none;font-size:13.5px;font-weight:700;color:#111;cursor:pointer;padding:6px 10px}
.grades{display:flex;gap:9px;margin-top:16px}
.grades button{flex:1;padding:11px 0 9px;border-radius:999px;border:1.5px solid #d9d9d9;background:#fff;font-size:14.5px;font-weight:700;cursor:pointer;color:#111}
.grades button:active{background:#111;color:#fff;border-color:#111}
.grades .iv{display:block;font-size:11px;font-weight:400;color:#8a8a8a;margin-top:2px}
.grades button:active .iv{color:#ddd}
.modes{display:flex;gap:9px;margin-top:12px}
.modebtn{flex:1;padding:12px 0;border-radius:999px;border:1.5px solid #d9d9d9;background:#fff;font-weight:700;font-size:14px;cursor:pointer;color:#111}
.modebtn.on{background:#111;color:#fff;border-color:#111}
.panel{margin-top:14px;border:1px solid #ececec;border-radius:18px;padding:18px;background:#fff}
.pillbtn{padding:11px 18px;border-radius:999px;border:1.5px solid #111;background:#111;color:#fff;font-weight:700;font-size:13.5px;cursor:pointer}
.pillbtn.ghost{background:#fff;color:#111;border-color:#d9d9d9}
.pillbtn:disabled{opacity:.35}
.recstat{font-size:12.5px;color:#8a8a8a;min-height:16px;margin-top:10px}
.faces{display:flex;gap:10px;align-items:center;margin-top:14px}
.face{width:40px;height:40px;border-radius:50%;border:1.5px solid #d9d9d9;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.face.on{background:#111;border-color:#111;color:#fff}
.blank{display:inline-block;min-width:76px;border-bottom:2.5px solid #111}
#pad{width:100%;height:150px;background:#f5f5f5;border-radius:14px;touch-action:none;display:block}
.cloze-ans{font-weight:700;font-size:17px}
.daybar{display:flex;align-items:center;gap:18px;padding:6px 0 16px;border-bottom:1px solid #ececec}
.ringwrap{position:relative;width:64px;height:64px;flex:none}
.ringwrap svg{transform:rotate(-90deg)}
.ringnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.statgrid{display:flex;gap:14px;flex:1;justify-content:space-between}
.dstat{text-align:center}
.dstat .n{font-size:19px;font-weight:800}
.dstat .t{font-size:11px;color:#8a8a8a;margin-top:3px}
.cropwrap{position:relative;width:100%;overflow:hidden;border-radius:12px;background:#111;touch-action:none;user-select:none;-webkit-user-select:none}
.cropwrap img{display:block;width:100%;pointer-events:none}
.cropbox{position:absolute;border:2.5px solid #111;box-shadow:0 0 0 9999px rgba(0,0,0,.45);border-radius:6px;cursor:move;touch-action:none}
.crophandle{position:absolute;right:-14px;bottom:-14px;width:28px;height:28px;border-radius:50%;background:#111;color:#fff;font-size:16px;line-height:28px;text-align:center;cursor:nwse-resize;touch-action:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:#f0f0f0;color:#555;border-radius:999px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer}
.field{margin:12px 0}
.field label{display:block;font-size:13px;color:#8a8a8a;margin-bottom:6px;font-weight:700}
.field input{width:100%;border:1.5px solid #e5e5e5;border-radius:10px;padding:11px 12px;font-size:16px;background:#fff}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid #ddd;border-top-color:#111;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.recording{background:#111!important;color:#fff!important}
#q.searched{color:#9a9a9a}
.tag .gl{color:#555;font-weight:400;font-size:12px}
.node .gl{display:block;font-size:11px;font-weight:400;color:#8a8a8a}
.capzh{color:#111;font-weight:700;font-size:14.5px;margin-top:2px}
.histlbl{font-size:12px;color:#9a9a9a;margin:8px 2px 0}
.capline{padding:3px 0;border-bottom:1px dashed #e8e8e8}
.capline:last-child{border-bottom:0}
.tok{display:inline-block;padding:1px 3px;margin:1px 0;border-radius:4px;cursor:pointer;font-size:17px;line-height:1.6}
.tok:hover{background:#f0f0f0}
.tok.sel{background:#d9d9d9;font-weight:700}
.tok.pre{background:#e6e6e6;font-weight:700}
.captext{background:#fff;border:1px solid #e3e3e3;border-radius:16px;padding:16px;margin-top:10px;line-height:2}
.capgrp{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid #ececec;align-items:baseline}
.capgrp .w{font-weight:700;font-size:14.5px;flex:none}
.capgrp .g{font-size:13.5px;color:#555;line-height:1.65}
mark{background:#e6e6e6;border-radius:4px;padding:0 3px}
textarea{width:100%;border:1.5px solid #e5e5e5;border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit;min-height:84px}
.dash{background:#111;color:#fff;border-radius:16px;padding:18px;margin:12px 0}
.dash .dnum{font-size:46px;font-weight:800;line-height:1.05}
.dash .drow{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.dash .dfore{font-size:14px;opacity:.85;padding-bottom:6px}
.dash .dover{color:#fff;font-weight:700;font-size:13px;text-decoration:underline}
.dash button{background:#fff;color:#111;margin-top:12px;font-size:16px}
#splash{position:fixed;inset:0;background:#fff;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .45s ease}
#srcPop{background:#fff;border:1px solid #e3e3e3;border-radius:18px;margin-top:10px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.10)}
#srcPop button{display:block;width:100%;background:#fff;color:#111;font-weight:400;font-size:15.5px;text-align:center;padding:16px 0;border:none;border-bottom:1px solid #f0f0f0;border-radius:0;cursor:pointer}
#srcPop button:last-child{border-bottom:none}
#srcPop button:active{background:#f5f5f5}
.donecard{background:#f4f4f4;border:1px solid #e7e7e7;border-radius:16px;padding:16px 18px;margin:12px 0;color:#111}
.donecard .secondary{background:#fff}
</style>
</head>
<body>
<div id="splash"><div style="font-size:30px;font-weight:700;letter-spacing:-.02em">WordNest</div></div>
<div class="app">
<div class="search" style="margin-top:6px">
<input id="q" autocomplete="off" autocapitalize="none" placeholder="输入单词，或粘贴一整段英文点选生词">
<button class="iconbtn" id="micBtn" title="语音输入">🎤</button>
<button id="searchBtn">查询</button>
</div>
<div id="searchHistory" class="hidden"><div class="histlbl">最近查询（点一下再看）</div><div class="chips" id="historyChips" style="margin-top:6px"></div></div>
<input type="file" id="photoInput" accept="image/*" class="hidden">
<nav>
<button class="active" data-tab="search" title="搜索" aria-label="搜索"><span class="ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5L16.7 16.7"/></svg></span></button>
<button id="photoBtn" type="button" data-tab="capture" title="拍照收词" aria-label="拍照收词"><span class="ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13.5" r="3.6"/></svg></span></button>
<button data-tab="review" title="闪卡复习" aria-label="闪卡复习"><span class="ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3.5l2.5 5.3 5.8.7-4.3 4 1.1 5.7L12 16.4l-5.1 2.8L8 13.5 3.7 9.5l5.8-.7z"/></svg><span class="badge hidden" id="dueBadge">0</span></span></button>
</nav>

<section id="searchTab">
<div class="lastrow">
<span id="lastLabel" class="lastlabel hidden">上次查的词</span>
<span style="flex:1"></span>
<button id="navMore" class="gearbtn" type="button" title="菜单" aria-label="菜单"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="6.2"/><circle cx="12" cy="12" r="2.6"/><path d="M12 3.4v2.4M12 18.2v2.4M3.4 12h2.4M18.2 12h2.4M5.9 5.9l1.7 1.7M16.4 16.4l1.7 1.7M18.1 5.9l-1.7 1.7M7.6 16.4l-1.7 1.7"/></svg></button>
<div id="moreMenu" class="hidden">
<button data-menu="library">闪卡列表</button>
<button data-menu="share">分享</button>
<button data-menu="stats">学习情况</button>
<button data-menu="settings">设置 · AI</button>
</div>
</div>
<div id="dash"></div>
<div id="result" class="empty">试试 <b>hello</b>、<b>improve</b>、<b>figure out</b><br><span class="small">支持中文输入，如「承担」；粘贴整段英文可点选生词</span></div>
</section>

<section id="captureTab" class="hidden">
<div id="srcPop" class="hidden">
<button data-src="camera" type="button">拍照</button>
<button data-src="library" type="button">照片图库</button>
<button data-src="file" type="button">取文件</button>
</div>

<section id="ocrPanel" class="card hidden">
<h2 style="margin-top:0">框选要识别的英文</h2>
<div class="cropwrap" id="cropWrap">
<img id="cropImg" alt="待识别照片">
<div class="cropbox" id="cropBox"><div class="crophandle" id="cropHandle">↘</div></div>
</div>
<div class="actions">
<button id="ocrRunBtn">识别内容</button>
<button class="secondary" id="ocrCancelBtn">取消</button>
</div>
<div id="ocrStatus" class="small" style="margin-top:10px"></div>
<div id="ocrResult"></div>
</section>

<section id="capturePanel" class="card hidden">
<h2 style="margin-top:0">点选生词</h2>
<div id="captureArea"></div>
</section>
<div id="batchDone" class="hidden"></div>
</section>

<section id="reviewTab" class="hidden">
<div id="daybar"></div>
<div id="session"></div>
<div id="modePanel"></div>
</section>

<section id="libraryTab" class="hidden">
<div class="card">
<div style="display:flex;align-items:center;justify-content:space-between"><h2 style="margin:0">我的词库</h2><button class="secondary" data-action="goto-search">收起 ▲</button></div>
<div class="field"><input id="libFilter" placeholder="🔎 在词库里找词…"></div>
<div id="libraryList"></div>
</div>
</section>

<section id="statsTab" class="hidden">
<div class="card">
<h2 style="margin-top:0">学习情况</h2>
<div id="statsBody"></div>
</div>
</section>

<section id="settingsTab" class="hidden">
<div class="card">
<h2>✨ AI</h2>
<div class="small">填 Key 后，查词不完整时自动用 AI 补全。Key 只存本机。DeepSeek 可用你 DeepTutor 里同一个 Key：在 Mac 上复制、iPhone 上粘贴。</div>
<div class="field"><label>服务商</label>
<select id="aiPreset" style="width:100%;border:1.5px solid #e5e7eb;border-radius:12px;padding:11px 12px;font-size:16px;background:#fff">
<option value="">自定义</option>
<option value="openai">OpenAI</option>
<option value="deepseek">DeepSeek</option>
<option value="qwen">通义千问</option>
<option value="moonshot">Kimi</option><option value="gemini">Google Gemini（免费额度）</option><option value="siliconflow">硅基流动</option>
</select></div>
<div class="field"><label>API 地址</label><input id="aiBase" placeholder="https://api.openai.com/v1"></div>
<div class="field"><label>API Key</label><input id="aiKey" type="password" placeholder="sk-..."></div>
<div class="field"><label>模型</label><input id="aiModel" placeholder="gpt-4o-mini"></div>
<div class="field"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="aiAuto" style="flex:0 0 auto;width:20px;height:20px" checked> 查词不完整时自动 AI 补全</label></div>
<div class="actions"><button id="aiSaveBtn">保存</button></div>
</div>
<div class="card">
<h2>🔊 复习</h2>
<label style="display:flex;gap:8px;align-items:center;font-size:15px;color:#374151"><input type="checkbox" id="autoSpeak" checked> 闪卡出现时自动朗读单词</label>
</div>
<div class="card">
<h2>数据</h2>
<div class="meaning">词库存在本机浏览器里。</div>
<div class="actions"><button class="secondary" id="exportBtn">导出词库 JSON</button></div>
</div>
</section>

<footer>WordNest V3.6.2 · 数据存本机</footer>
</div>

<div id="toast" class="toast"></div>

<script>
"use strict";

const DICT = {
"hello":{"pos":"interjection / noun","zh":"你好；用于打招呼，也可以表示问候。","meaning":"A friendly word used when you meet or greet someone.","example":"Hello! Nice to meet you.","family":["hello","hello there"],"root":"常用问候语；不是按拉丁词根拆分的词。"},
"improve":{"pos":"verb","zh":"改善；提高；变得更好。","meaning":"To make something better, or to become better.","example":"I want to improve my English.","family":["improvement","improved","improving"],"root":"improve → improvement（改善、提高）"},
"important":{"pos":"adjective","zh":"重要的；值得重视的。","meaning":"Having a lot of value, meaning, or importance.","example":"This is an important lesson.","family":["importance","importantly"],"root":"important → importance"},
"achieve":{"pos":"verb","zh":"实现；达到（目标）。","meaning":"To successfully reach a goal after working toward it.","example":"She worked hard to achieve her goal.","family":["achievement","achievable","achieved"],"root":"achieve → achievement（成就）"},
"resilient":{"pos":"adjective","zh":"有韧性的；能从困难中恢复的。","meaning":"Able to recover and keep going after difficulty.","example":"Children can be surprisingly resilient.","family":["resilience","resiliently"],"root":"resilient → resilience"},

/* ================= Storage (V2, migrates V1) ================= */
const KEY_V2 = "wordnest_library_v3";
const KEY_V1 = "wordnest_library_v2";
const DAY = 86400000;

function newCard(term){
  return {term:term, addedAt:Date.now(), due:Date.now(), intervalDays:0, ease:2.5,
    reps:0, lapses:0, state:"new", lookups:0, correct:0, wrong:0, detail:null, unknown:false};
}
function loadLib(){
  try{
    const raw = localStorage.getItem(KEY_V2);
    if(raw) return JSON.parse(raw) || {};
    const old = localStorage.getItem(KEY_V1);
    if(old){
      const o = JSON.parse(old) || {}; const out = {};
      const daysByLevel = [0,1,3,7,14,30];
      for(const k of Object.keys(o)){
        const c = newCard(k); const v = o[k] || {};
        c.lookups = v.lookups||1; c.correct = v.correct||0; c.wrong = v.wrong||0;
        c.intervalDays = daysByLevel[Math.min(v.level||0,5)];
        c.due = v.next || Date.now();
        c.state = (v.level||0) > 0 ? "review" : "new";
        c.unknown = !!v.unknown;
        if(DICT[k]) c.detail = DICT[k];
        out[k] = c;
      }
      localStorage.setItem(KEY_V2, JSON.stringify(out));
      return out;
    }
    return {};
  }catch(e){ return {}; }
}
function saveLib(x){ localStorage.setItem(KEY_V2, JSON.stringify(x)); }
function ensureCard(lib, term){
  if(!lib[term]) lib[term] = newCard(term);
  return lib[term];
}

/* ================= SRS CORE START ================= */
function fmtInterval(days){
  if(days <= 0) return "10分钟";
  if(days < 1) return Math.round(days*24*60) + "分钟";
  if(days < 30) return (Math.round(days*10)/10) + "天";
  if(days < 365) return (Math.round(days/30*10)/10) + "个月";
  return (Math.round(days/365*10)/10) + "年";
}
function srsCalc(card, grade){
  /* Anki-style scheduling. New words and old words live on different
     clocks: a new/learning card first passes short steps (10min / 12h /
     1d / 4d); only review cards grow multiplicatively by ease, and an
     Again on a review card sends it back to relearning (a lapse). */
  const ease0 = card.ease || 2.5;
  const I = card.intervalDays || 0;
  const st = card.state || "new";
  const isLearning = st === "new" || st === "learning";
  if(grade === "again"){
    return {dueMs: Date.now() + 10*60*1000, intervalDays: 0, state: "learning",
      ease: isLearning ? ease0 : Math.max(1.3, ease0 - 0.2), label: "10分钟"};
  }
  if(isLearning){
    if(grade === "hard")
      return {dueMs: Date.now() + 12*3600*1000, intervalDays: 0.5, state: "review",
        ease: Math.max(1.3, ease0 - 0.15), label: "12小时"};
    if(grade === "good")
      return {dueMs: Date.now() + DAY, intervalDays: 1, state: "review",
        ease: ease0, label: "1天"};
    return {dueMs: Date.now() + 4*DAY, intervalDays: 4, state: "review",
      ease: Math.min(2.8, ease0 + 0.15), label: "4天"};
  }
  let days, ease = ease0;
  if(grade === "hard"){ days = Math.max(1, I * 1.2); ease = Math.max(1.3, ease0 - 0.15); }
  else if(grade === "good"){ days = Math.max(1, I * ease0); }
  else { days = Math.max(1, I * ease0 * 1.3); ease = Math.min(2.8, ease0 + 0.15); }
  days = Math.min(365, Math.round(days*10)/10);
  return {dueMs: Date.now() + days*DAY, intervalDays: days, state: "review", ease: ease, label: fmtInterval(days)};
}
function applyGrade(card, grade){
  const r = srsCalc(card, grade);
  if(grade === "again"){ card.lapses = (card.lapses||0)+1; card.wrong = (card.wrong||0)+1; }
  if(grade === "good" || grade === "easy"){ card.correct = (card.correct||0)+1; }
  if(grade === "hard"){ card.wrong = (card.wrong||0)+1; }
  card.due = r.dueMs; card.intervalDays = r.intervalDays; card.ease = r.ease;
  card.reps = (card.reps||0)+1; card.state = r.state || (grade === "again" ? "learning" : "review");
  card.lastGrade = grade; card.lastReview = Date.now();
  return r;
}

function learningTerms(lib){
  const now = Date.now();
  return Object.keys(lib).filter(t => (lib[t].state || "new") === "learning" && (lib[t].due || 0) > now)
    .sort((a,b) => (lib[a].due||0) - (lib[b].due||0));
}
function reviewQueueTerms(lib){
  const due = dueTerms(lib);
  const st = t => (lib[t].state || "new");
  const review = due.filter(t => st(t) === "review");
  const learning = due.filter(t => st(t) === "learning").concat(learningTerms(lib));
  const fresh = due.filter(t => st(t) === "new");
  return review.concat(learning, fresh);
}
function forecastCounts(lib){
  /* Due counts for today / tomorrow / day after, by local calendar day.
     Anything overdue rolls into today's pile (it never disappears). */
  const now = new Date();
  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const out = {today: 0, tomorrow: 0, day2: 0, overdue: 0};
  Object.keys(lib).forEach(t => {
    const c = lib[t];
    if(!cardReviewable(c)) return;
    const due = c.due || 0;
    const idx = Math.floor((due - startToday) / DAY);
    if(idx <= 0){ out.today++; if(due < startToday && (c.reps || 0) > 0) out.overdue++; }
    else if(idx === 1) out.tomorrow++;
    else if(idx === 2) out.day2++;
  });
  return out;
}
function renderDashboard(){
  const el = document.getElementById("dash"); if(!el) return;
  const f = forecastCounts(loadLib());
  if(!f.today && !f.tomorrow && !f.day2){
    el.innerHTML = '<div class="dash"><div style="font-size:19px;font-weight:800">🃏 今日复习</div>' +
      '<div class="dfore" style="margin-top:6px">近三天没有到期的卡片 🎉 查些新词进来吧。</div></div>';
    return;
  }
  el.innerHTML = '<div class="dash">' +
    (f.overdue ? '<div class="dover">⚠️ 有 ' + f.overdue + ' 张已逾期——没背的不会消失，会顺延累积到今天</div>' : '') +
    '<div class="drow"><div><div style="font-size:13px;opacity:.8">🃏 今日待复习</div>' +
    '<div class="dnum">' + f.today + '<span style="font-size:18px"> 张</span></div></div>' +
    '<div class="dfore">明天 ' + f.tomorrow + ' 张 · 后天 ' + f.day2 + ' 张</div></div>' +
    (f.today ? '<button data-action="start-review">▶ 开始今日复习</button>'
             : '<div class="dfore" style="margin-top:8px">今天没有要背的，明天的先放着。</div>') +
    '</div>';
}
function cardReviewable(c){
  if(!c) return false;
  const d = c.detail || {};
  if(d.meaning || d.zh) return true;
  /* cards already in the SRS cycle (incl. migrated ones) keep working */
  return (c.reps || 0) > 0 || c.state === "review" || c.state === "learning";
}
function dueTerms(lib, now){
  now = now || Date.now();
  return Object.keys(lib).filter(k => cardReviewable(lib[k]) && (!lib[k].due || lib[k].due <= now))
    .sort((a,b) => (lib[a].due||0) - (lib[b].due||0));
}

  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ================= Pronunciation ================= */
let currentAudio = null;
function speak(text, audioUrl){
  text = String(text||"").trim(); if(!text) return;
  if(audioUrl){
    try{
      if(currentAudio){ currentAudio.pause(); }
      currentAudio = new Audio(audioUrl);
      currentAudio.onerror = ()=> speakTTS(text);
      currentAudio.play().catch(()=> speakTTS(text));
      return;
    }catch(e){ /* fall through */ }
  }
  speakTTS(text);
}
function autoSpeakOn(){ try{ return localStorage.getItem("wordnest_autospeak") !== "0"; }catch(e){ return true; } }
function speakTTS(text){
  if(!("speechSynthesis" in window)){ toast("这个浏览器不支持语音朗读"); return; }
  try{ speechSynthesis.resume(); }catch(e){} /* iOS leaves it paused sometimes */
  speechSynthesis.cancel();
  const make = () => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.92;
    const v = speechSynthesis.getVoices().filter(x => /^en[-_]/i.test(x.lang));
    if(v.length) u.voice = v[0];
    return u;
  };
  const doSpeak = () => {
    speechSynthesis.speak(make());
    /* iOS occasionally drops an utterance silently — if nothing is
       speaking shortly after, submit it once more. */
    setTimeout(()=>{ try{
      if(!speechSynthesis.speaking && !speechSynthesis.pending){
        speechSynthesis.resume(); speechSynthesis.speak(make());
      } }catch(e){} }, 700);
  };
  if(speechSynthesis.getVoices().length) doSpeak();
  else{
    let done = false;
    const h = ()=>{ if(done) return; done = true; doSpeak(); };
    try{ speechSynthesis.addEventListener("voiceschanged", h, {once: true}); }catch(e){}
    setTimeout(h, 350);
  }
}
if("speechSynthesis" in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = ()=> speechSynthesis.getVoices(); }

function findLocal(term){
  if(DICT[term]) return DICT[term];
  const noSpace = term.replace(/\s+/g,"");
  for(const k of Object.keys(DICT)){ if(k.replace(/\s+/g,"") === noSpace) return DICT[k]; }
  return null;
}

function hasCJK(t){ return /[\u4e00-\u9fff]/.test(String(t||"")); }
function spellingVariants(term){
  const out = new Set(); const w = String(term||"");
  for(let i = 0; i < w.length; i++) out.add(w.slice(0,i) + w.slice(i+1));         // delete one letter: borne -> bone/born/bore
  for(let i = 0; i + 1 < w.length; i++) out.add(w.slice(0,i) + w[i+1] + w[i] + w.slice(i+2)); // transpose
  out.delete(w);
  return Array.from(out).filter(v => v.length >= 3);
}
function mergeFamily(lists, term, cap){
  const seen = new Set([String(term||"").toLowerCase()]); const out = [];
  for(const list of lists){
    for(const w of (list||[])){
      const x = String(w||"").trim().toLowerCase();
      if(!x || seen.has(x) || !/^[a-z][a-z'-]*$/.test(x)) continue;
      seen.add(x); out.push(x);
      if(out.length >= (cap || 8)) return out;
    }
  }
  return out;
}
function lemmaCandidates(term){
  const map = {borne:"bear", born:"bear", went:"go", gone:"go", children:"child",
    men:"man", women:"woman", better:"good", best:"good", worse:"bad", mice:"mouse",
    geese:"goose", feet:"foot", teeth:"tooth", took:"take", gave:"give", saw:"see"};
  if(map[term]) return [map[term]];
  const out = [];
  if(/ies$/.test(term)) out.push(term.slice(0,-3) + "y");
  if(/[^aeiou]ing$/.test(term)){ const b = term.slice(0,-3); out.push(b);
    if(/(.)\1$/.test(b)) out.push(b.slice(0,-1)); /* running -> run */
    out.push(b + "e"); }
  if(/ed$/.test(term)){ const b = term.slice(0,-2); out.push(b);
    if(/(.)\1$/.test(b)) out.push(b.slice(0,-1)); /* sapped -> sap, stopped -> stop */
    out.push(b + "e", term.slice(0,-1)); }
  if(/es$/.test(term)) out.push(term.slice(0,-2));
  if(/s$/.test(term) && term.length > 3) out.push(term.slice(0,-1));
  return Array.from(new Set(out.filter(x => x && x !== term)));
}

function simplifyDefText(t){

     with horror or detestation"). Keep only it when the full text is long. */
  const s = String(t || "").trim();
  if(s.length > 100 && s.indexOf(";") > 0) return s.slice(0, s.indexOf(";")).trim();

function pickSimpleDef(defs){

  const pool = withEx.length ? withEx : defs;
  const short = pool.filter(x => (x.definition || "").length <= 110);
  const sorted = (short.length ? short : pool).slice()
    .sort((a, b) => (a.definition || "").length - (b.definition || "").length);

}
async function fetchDictEntry(word){

async function googleTranslate(text, from, to){
  /* Google's public translate endpoint: far more accurate for single words
     than the crowd-sourced translation memory (which produced 鬼蜮/二五仔/
     a blockchain sentence). Falls back silently when unreachable. */
  let ctl = null, timer = null;
  try{ ctl = new AbortController(); timer = setTimeout(()=> ctl.abort(), 4500); }catch(e){}
  try{
    const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=" +
      encodeURIComponent(from) + "&tl=" + encodeURIComponent(to) + "&dt=t&q=" + encodeURIComponent(text),
      ctl ? {signal: ctl.signal} : {});
    if(!r.ok) return "";
    const j = await r.json();
    const out = ((j && j[0]) || []).map(seg => (seg && seg[0]) || "").join("");
    return cleanTranslation(out);
  }catch(e){ return ""; }

  const g = await googleTranslate(text, from, to);
  if(g && g.toLowerCase() !== String(text).toLowerCase()) return g;
  try{
    const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) +
      "&langpair=" + encodeURIComponent(from) + "|" + encodeURIComponent(to));
    if(!r.ok) return "";
    const j = await r.json();
    const t = cleanTranslation(j && j.responseData && j.responseData.translatedText || "");
    return t && t.toLowerCase() !== String(text).toLowerCase() ? t : "";
  }catch(e){ return ""; }

async function fetchOnline(term){

        entry = await fetchDictEntry(cand);
        if(entry){ lemma = cand; break; }

    }
    if(entry){
      detail = {pos: entry.pos, zh: "", meaning: entry.meaning, example: entry.example,
        phonetic: entry.phonetic, audio: entry.audio, family: [], root: "", source: "online", synonyms: entry.synonyms,
        senses: entry.senses || [], v: 2};

    }
    const fam = await fetchFamily(term, lemma, entry ? entry.synonyms : []);
    detail = detail || {pos:"", zh:"", meaning:"", example:"", family:[], root:"", source:"online", v:2};
    detail.family = mergeFamily([detail.family, fam], term, 8);
    detail.root = etymologyFor(term, lemma);

  }

    : await translateWord(term, detail.pos || "");

    (morphText ? '<div class="meaning" style="margin-top:16px"><b>词根：</b>' + escapeHtml(morphText) + '</div>' : '') +
    (syns.length ? '<div class="meaning" style="margin-top:14px"><b>同近义词：</b>' + syns.map(escapeHtml).join('、') + '</div>' : '') +
    (etymText ? '<div class="meaning" style="margin-top:14px"><b>词源：</b>' + escapeHtml(etymText) + '</div>' : '') +

    (d.source === "ai" ? '<div class="small" style="margin-top:8px">部分内容由 AI 补全</div>' : '') +

function renderResult(term, d){
  try{ localStorage.setItem("wordnest_last_lookup_v1", term); }catch(e){}
  const el = document.getElementById("result");

async function glossFor(word){
  const local = findLocal(word);
  if(local && local.zh) return local.zh.split(/[；;]/)[0];
  const t = await translateText(word, "en", "zh-CN");
  return t ? t.split(/[；;]/)[0].slice(0, 12) : "";
}
async function enrichFamilyGloss(term, d){
  const fam = (d && d.family) || [];
  if(!fam.length) return;
  const gloss = Object.assign({}, d.familyGloss || {});
  const missing = fam.filter(x => !gloss[x]);
  if(!missing.length) return;
  await Promise.all(missing.map(async x => {
    try{ const g = await glossFor(x); if(g) gloss[x] = g; }catch(e){}
  }));
  if(!Object.keys(gloss).length) return;
  const lib = loadLib(); const card = lib[term];
  if(!card || !card.detail) return;
  card.detail.familyGloss = gloss; saveLib(lib);
  const el = document.getElementById("result");
  if(el && el.dataset.term === term){
    el.innerHTML = detailHtml(term, card.detail, "graphMain");
  }
}
async function search(termArg){
  let term = norm(typeof termArg === "string" ? termArg : document.getElementById("q").value);
  if(!term){ toast("输入一个词，或拍照、粘贴"); return; }
  const fromInput = typeof termArg !== "string";
  const rawInput = fromInput ? document.getElementById("q").value : termArg;
  if(fromInput && !hasCJK(rawInput) && rawInput.trim().split(/\s+/).filter(Boolean).length >= 4){
    const toks = buildTextTokens(rawInput.trim()).filter(t => /[A-Za-z]/.test(t.raw));
    if(toks.length >= 4){
      const cp = document.getElementById("capturePanel");
      cp.classList.remove("hidden");
      setupCapture(document.getElementById("captureArea"), toks, "paste");
      switchTab("capture");
      scrollToEl(cp);
      return;
    }
  }
  if(hasCJK(term)){
    toast("正在把中文译成英文…");
    const en = await translateText(term, "zh-CN", "en");
    if(!en || hasCJK(en)){ toast("没能译成英文，换个说法试试"); return; }
    term = norm(en);
    toast("按英文词查询：" + term);
  }
  document.getElementById("q").value = term;
  const ll = document.getElementById("lastLabel"); if(ll) ll.classList.add("hidden");
  noteSearched(term);
  document.getElementById("q").value = "";
  switchTab("search");
  const lib = loadLib();
  const card = ensureCard(lib, term);
  card.lookups = (card.lookups||0) + 1;

  const local = findLocal(term);
  if(local){
    card.detail = local; card.unknown = false; saveLib(lib);
    renderResult(term, local); refreshAll(); return;
  }
  if(card.detail && card.detail.meaning && (card.detail.v || 0) >= 2){
    const d = card.detail;
    if(!d.root) d.root = etymologyFor(term, d.lemma || "");
    if(d.meaning) d.meaning = simplifyDefText(d.meaning);
    if(d.phonetic) d.phonetic = sanitizePhonetic(d.phonetic);
    saveLib(lib); renderResult(term, d); refreshAll(); return;
  }
  const result = document.getElementById("result");
  result.innerHTML = '<div class="card"><span class="spin"></span>正在在线查询「' + escapeHtml(term) + '」…</div>';
  saveLib(lib);
  let online = await fetchOnline(term);
  const lib2 = loadLib(); const card2 = ensureCard(lib2, term);
  if(online && (online.meaning || online.zh)){
    const aiS = aiSettings();
    if(aiS.key && aiS.auto !== false && detailIncomplete(online)){
      result.innerHTML = '<div class="card"><span class="spin"></span>资料不完整，正在用 AI 补全…</div>';
      try{ const ai = await aiLookup(term); if(ai) online = mergeAiDetail(online, ai); }
      catch(e){ /* keep dictionary result */ }
      const lib3 = loadLib(); const card3 = ensureCard(lib3, term);
      card3.detail = online; card3.unknown = false; saveLib(lib3);
      renderResult(term, online); refreshAll(); return;
    }
    card2.detail = online; card2.unknown = false; saveLib(lib2);
    renderResult(term, online);
  }else if(card.detail && (card.detail.meaning || card.detail.zh)){
    saveLib(lib2); renderResult(term, card.detail);
  }else{
    card2.unknown = true; saveLib(lib2);
    result.innerHTML = '<div class="card">' +
      '<div><span class="word">' + escapeHtml(term) + '</span>' + speakBtn(term, "") + '</div>' +
      '<div class="zh">暂时没有查到这个词的资料</div>' +
      '<div class="meaning">离线词典里没有它，在线词典也没查到（可能没网，或它是非常用短语）。它已加入词库，你可以：</div>' +
      '<div class="actions">' +
        '<button data-action="ai-deep" data-term="' + escapeHtml(term) + '">✨ 用 AI 查询</button>' +
      '</div></div>';
  }
  refreshAll();
}

/* ================= Relation graph (kept from V1, clickable) ================= */
function drawGraph(g, term, family, glossMap){
  if(!g) return;
  g.innerHTML = "";
  const cx = 50, cy = 50;
  const list = (family||[]).slice(0,6);
  list.forEach((w, i) => {
    const a = (Math.PI*2*i/Math.max(1,list.length)) - Math.PI/2;
    const x = 50 + 35*Math.cos(a), y = 50 + 35*Math.sin(a);
    const dx = x-cx, dy = y-cy, len = Math.sqrt(dx*dx + dy*dy);
    const line = document.createElement("div");
    line.className = "line";
    line.style.left = cx + "%"; line.style.top = cy + "%";
    line.style.width = len + "%";
    line.style.transform = "rotate(" + (Math.atan2(dy,dx)*180/Math.PI) + "deg)";
    g.appendChild(line);
    const n = document.createElement("div");
    n.className = "node";
    const gl = (glossMap || {})[w];
    n.innerHTML = escapeHtml(w) + (gl ? '<span class="gl">' + escapeHtml(gl) + '</span>' : '');
    n.style.left = "calc(" + x + "% - 30px)"; n.style.top = "calc(" + y + "% - 18px)";
    n.addEventListener("click", ()=> search(w));
    g.appendChild(n);
  });
  const c = document.createElement("div");
  c.className = "node"; c.textContent = term;
  c.style.left = "calc(50% - 35px)"; c.style.top = "calc(50% - 18px)";
  c.style.background = "#111"; c.style.color = "#fff";
  g.appendChild(c);
}

/* ================= Anki-style flashcard session ================= */
let session = null; /* {queue:[], total:0, done:0, stats:{again,hard,good,easy}, current:null, showing:false} */
let undoState = null; /* {term, prev, grade, sessionRef, statsBefore, doneBefore, totalBefore} */
function capNewCards(queue, lib){
  const fresh = [], rest = [];
  queue.forEach(t => {
    const c = lib[t] || {};
    if((c.state || "new") === "new" && !(c.reps || 0)) fresh.push(t); else rest.push(t);
  });
  return rest.concat(fresh.slice(0, 20));
}
function startReview(onlyTerm){
  const lib = loadLib();
  undoState = null;
  let queue;
  if(onlyTerm){ queue = [onlyTerm]; }
  else{ queue = capNewCards(Array.from(new Set(reviewQueueTerms(lib))), lib); }
  if(!queue.length){
    switchTab("review");
    document.getElementById("session").innerHTML =
      '<div class="card empty">今天没有到期的卡片 🎉<div class="actions" style="justify-content:center"><button data-action="goto-search">去查新词</button></div></div>';
    return;
  }
  session = {queue: queue.slice(), total: queue.length, done: 0,
    stats: {again:0, hard:0, good:0, easy:0}, current: null, showing: false, requeued: {}};
  const mix = {review: 0, learning: 0, fresh: 0};
  queue.forEach(t => { const st = (lib[t] || {}).state || "new";
    if(st === "review") mix.review++; else if(st === "learning") mix.learning++; else mix.fresh++; });
  session.mix = mix;
  switchTab("review");
  nextCard();
}
function nextCard(){
  const el = document.getElementById("session");
  if(!session || !session.queue.length){
    const s = session ? session.stats : {again:0, hard:0, good:0, easy:0};
    const total = session ? session.total : 0;
    const remain = reviewQueueTerms(loadLib()).length;
    el.innerHTML = '<div class="card fc"><div style="font-size:44px">🎉</div>' +
      '<h2>本轮复习完成</h2>' +
      '<div class="meaning">共复习 ' + total + ' 张 · Again ' + s.again + ' · Hard ' + s.hard +
      ' · Good ' + s.good + ' · Easy ' + s.easy + '</div>' +
      (remain ? '<div class="meaning" style="margin-top:8px">还有 <b>' + remain +
        ' 张</b>没复习完（含新词和没记住的），点下方「继续复习」接着来。</div>' : '') +
      '<div class="actions"><button data-action="start-review">继续复习</button>' +
      '<button class="secondary" data-action="goto-search">去查新词</button>' +

      '</div></div>';

function progressHtml(){

function gradeCurrent(grade){
  if(!session || !session.current) return;
  const term = session.current;
  const lib = loadLib(); const card = ensureCard(lib, term);
  if(!card.detail){ const local = findLocal(term); if(local) card.detail = local; }
  const prev = {};
  ["due","intervalDays","ease","reps","lapses","state","correct","wrong","lastGrade","lastReview"]
    .forEach(k => { prev[k] = card[k]; });
  undoState = {term: term, prev: prev, grade: grade, sessionRef: session,
    statsBefore: Object.assign({}, session.stats), doneBefore: session.done, totalBefore: session.total};
  applyGrade(card, grade); saveLib(lib);
  session.stats[grade]++; session.done++;
  const ds = loadDayStats(); ds.done++;
  if(grade === "good" || grade === "easy") ds.mastered++;
  if(grade === "again") ds.failed++;
  saveDayStats(ds);
  /* Again cards are scheduled +10min and stay counted as pending (badge),
     but no longer repeat inside this session — review goes straight through. */

/* ================= Photo + crop + OCR ================= */
const crop = {x: 0.1, y: 0.2, w: 0.8, h: 0.35}; /* fractions of displayed image */
function layoutCropBox(){
  const wrap = document.getElementById("cropWrap");
  const box = document.getElementById("cropBox");
  const W = wrap.clientWidth, H = wrap.clientHeight;
  box.style.left = (crop.x*W) + "px"; box.style.top = (crop.y*H) + "px";
  box.style.width = (crop.w*W) + "px"; box.style.height = (crop.h*H) + "px";
}
function initCropDrag(){
  const wrap = document.getElementById("cropWrap");
  const box = document.getElementById("cropBox");
  const handle = document.getElementById("cropHandle");
  let drag = null;
  function pos(e){ const r = wrap.getBoundingClientRect(); return {px: e.clientX - r.left, py: e.clientY - r.top, W: r.width, H: r.height}; }
  box.addEventListener("pointerdown", e => {
    if(e.target === handle) return;
    drag = {mode: "move", dx: e.clientX, dy: e.clientY, start: Object.assign({}, crop)};
    box.setPointerCapture(e.pointerId); e.preventDefault();
  });
  handle.addEventListener("pointerdown", e => {
    drag = {mode: "resize", dx: e.clientX, dy: e.clientY, start: Object.assign({}, crop)};
    handle.setPointerCapture(e.pointerId); e.preventDefault(); e.stopPropagation();
  });
  window.addEventListener("pointermove", e => {
    if(!drag) return;
    const r = wrap.getBoundingClientRect();
    const ddx = (e.clientX - drag.dx)/r.width, ddy = (e.clientY - drag.dy)/r.height;
    if(drag.mode === "move"){
      crop.x = Math.min(1 - crop.w, Math.max(0, drag.start.x + ddx));
      crop.y = Math.min(1 - crop.h, Math.max(0, drag.start.y + ddy));
    }else{
      crop.w = Math.min(1 - crop.x, Math.max(0.15, drag.start.w + ddx));
      crop.h = Math.min(1 - crop.y, Math.max(0.1, drag.start.h + ddy));
    }
    layoutCropBox();
  });
  window.addEventListener("pointerup", ()=> drag = null);
  window.addEventListener("resize", layoutCropBox);
}
let tesseractLoading = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoading) return tesseractLoading;
  tesseractLoading = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js";
    s.onload = res; s.onerror = ()=> rej(new Error("OCR 引擎加载失败，请检查网络"));
    document.head.appendChild(s);
  });
  return tesseractLoading;
}
async function runOCR(){
  const img = document.getElementById("cropImg");
  const status = document.getElementById("ocrStatus");
  const out = document.getElementById("ocrResult");
  if(!img.naturalWidth){ toast("先拍照或选一张图"); return; }
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(img.naturalWidth * crop.w);
  canvas.height = Math.round(img.naturalHeight * crop.h);
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, img.naturalWidth*crop.x, img.naturalHeight*crop.y,
    img.naturalWidth*crop.w, img.naturalHeight*crop.h, 0, 0, canvas.width, canvas.height);
  /* Print-friendly copy for recognition: fade light marks (pencil underlines,
     faint handwriting) to white so the engine mostly sees printed text.
     The original canvas is kept untouched for mark detection. */
  const ocrCanvas = document.createElement("canvas");
  ocrCanvas.width = canvas.width; ocrCanvas.height = canvas.height;
  const octx = ocrCanvas.getContext("2d");
  octx.drawImage(canvas, 0, 0);
  try{
    const idata = octx.getImageData(0, 0, ocrCanvas.width, ocrCanvas.height);
    const px = idata.data;
    for(let i = 0; i < px.length; i += 4){
      const lum = 0.299*px[i] + 0.587*px[i+1] + 0.114*px[i+2];
      const v = lum <= 40 ? 0 : (lum >= 175 ? 255 : Math.round((lum - 40) * 255 / 135));
      px[i] = px[i+1] = px[i+2] = v;
    }
    octx.putImageData(idata, 0, 0);
  }catch(e){ /* fall back to the raw crop */ }
  status.innerHTML = '<span class="spin"></span>正在加载 OCR 引擎并识别框选区域…';
  out.innerHTML = "";
  try{
    await loadTesseract();
    const res = await Tesseract.recognize(ocrCanvas, "eng", {
      logger: m => { if(m.status === "recognizing text") status.innerHTML = '<span class="spin"></span>识别中 ' + Math.round((m.progress||0)*100) + "%…"; }
    });
    let words = (res.data && res.data.words) || [];
    if(!words.length && res.data){
      (res.data.blocks||[]).forEach(b => (b.paragraphs||[]).forEach(p => (p.lines||[]).forEach(l => (l.words||[]).forEach(w => words.push(w)))));
    }
    let tokens;
    if(words.length){
      tokens = buildOcrTokens(words);
      try{ analyzeMarks(canvas, tokens); }catch(e){ /* analysis is best-effort */ }
    }else{
      tokens = buildTextTokens((res.data && res.data.text) || "");
    }
    const withLetters = tokens.filter(t => /[A-Za-z]/.test(t.raw));
    tokens = withLetters.filter(t => t.conf === null || t.conf === undefined || t.conf >= 30);
    const ignored = withLetters.length - tokens.length;
    if(!tokens.length){ status.textContent = "框选区域里没有识别到英文，试着框紧一点、光线好一点。"; return; }
    const pre = tokens.filter(t => t.selected).length;
    status.textContent = "识别完成：共 " + tokens.length + " 个词，机器预选了 " + pre + " 个疑似被标记的词" +
      (ignored ? "，已自动忽略 " + ignored + " 个低置信度词（多为手写或污渍）" : "") +
      "。点词选中/取消，选中后自动翻译；分开点取各自成卡，同行连选合成一张短语卡。";
    setupCapture(out, tokens, "photo");
  }catch(err){
    status.textContent = String(err && err.message || err);
  }
}

/* ================= Capture: tokens, sentences, mark detection ================= */
/* == CAPTURE CORE START == */
function cleanTerm(raw){
  return String(raw||"").replace(/^[^A-Za-z']+|[^A-Za-z']+$/g,"").toLowerCase();
}
function splitSentenceRanges(text){
  const ranges = []; let start = 0;
  const re = /[^.!?。！？]+[.!?。！？]+["')\]]*\s*|[^.!?。！？]+$/g; let m;
  while((m = re.exec(text)) !== null){
    if(m[0].trim()) ranges.push({start: m.index, end: m.index + m[0].length, text: m[0].trim()});
    if(re.lastIndex === m.index) re.lastIndex++;
  }
  if(!ranges.length && text.trim()) ranges.push({start:0, end:text.length, text:text.trim()});
  return ranges;
}
function assignSentences(tokens){
  /* tokens: [{raw, offset}] in reading order; joins with single spaces */
  const text = tokens.map(t => t.raw).join(" ");
  const ranges = splitSentenceRanges(text);
  let pos = 0;
  const withOff = tokens.map(t => { const o = pos; pos += t.raw.length + 1; return o; });
  tokens.forEach((t, i) => {
    const mid = withOff[i] + t.raw.length/2;
    let si = ranges.findIndex(r => mid >= r.start && mid < r.end);
    if(si < 0) si = ranges.length - 1;
    t.sentenceIdx = Math.max(0, si);
  });
  return ranges.map(r => r.text);
}
function computeGroups(tokens, splitSet){
  const groups = []; let cur = null;
  tokens.forEach((t, i) => {
    if(t.selected){
      const prev = cur ? cur.indices[cur.indices.length - 1] : -1;
      if(cur && !splitSet.has(i) && prev === i - 1 && (tokens[prev].line || 0) === (t.line || 0)){ cur.indices.push(i); }
      else{ cur = {indices:[i], start:i}; groups.push(cur); }
    }else cur = null;
  });
  groups.forEach(g => {
    g.text = g.indices.map(i => cleanTerm(tokens[i].raw)).filter(Boolean).join(" ");
    g.sentence = tokens[g.indices[0]].sentenceText || "";
  });
  return groups.filter(g => g.text);
}
/* == CAPTURE CORE END == */
function buildTextTokens(text){
  const tokens = [];
  String(text||"").split(/\n/).forEach((lineText, li) => {
    lineText.trim().split(/\s+/).filter(Boolean).forEach(r =>
      tokens.push({raw: r, selected: false, mark: null, line: li}));
  });
  const sentences = assignSentences(tokens);
  tokens.forEach(t => t.sentenceText = sentences[t.sentenceIdx] || "");
  return tokens;
}
function buildOcrTokens(words){
  const items = words.filter(w => w && w.text && w.bbox).map(w => ({
    raw: String(w.text).trim(), bbox: w.bbox, selected: false, mark: null, conf: (typeof w.confidence === "number" ? w.confidence : null)
  })).filter(t => t.raw);
  /* cluster into lines by vertical overlap, then sort by x */
  items.sort((a,b) => (a.bbox.y0 - b.bbox.y0) || (a.bbox.x0 - b.bbox.x0));
  const lines = [];
  items.forEach(t => {
    const h = t.bbox.y1 - t.bbox.y0, cy = (t.bbox.y0 + t.bbox.y1)/2;
    let line = lines.find(l => Math.abs(l.cy - cy) < Math.max(8, h*0.6));
    if(!line){ line = {cy: cy, items: []}; lines.push(line); }
    line.items.push(t); line.cy = (line.cy*(line.items.length-1) + cy)/line.items.length;
  });
  lines.sort((a,b) => a.cy - b.cy);
  const tokens = [];
  lines.forEach((l, li) => { l.items.sort((a,b) => a.bbox.x0 - b.bbox.x0);
    l.items.forEach(t => { t.line = li; tokens.push(t); }); });
  const sentences = assignSentences(tokens);
  tokens.forEach(t => t.sentenceText = sentences[t.sentenceIdx] || "");
  return tokens;
}
function chromaOf(r,g,b){ return Math.max(r,g,b) - Math.min(r,g,b); }
function analyzeMarks(canvas, tokens){
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const data = ctx.getImageData(0, 0, W, H).data;
  function px(x, y){
    x = Math.max(0, Math.min(W-1, x|0)); y = Math.max(0, Math.min(H-1, y|0));
    const i = (y*W + x)*4; return [data[i], data[i+1], data[i+2]];
  }
  function fillRatio(x0,y0,x1,y1){
    let sat = 0, tot = 0;
    const step = Math.max(1, Math.floor(Math.min(x1-x0, y1-y0)/18)) || 1;
    for(let y = y0; y < y1; y += step) for(let x = x0; x < x1; x += step){
      const [r,g,b] = px(x,y); if((r+g+b)/3 < 110) continue;
      tot++; if(chromaOf(r,g,b) > 50) sat++;
    }
    return tot ? sat/tot : 0;
  }
  function stripMaxRow(x0,y0,x1,y1){
    let best = 0;
    for(let y = y0; y < y1; y++){
      let sat = 0, tot = 0;
      const step = Math.max(1, Math.floor((x1-x0)/40)) || 1;
      for(let x = x0; x < x1; x += step){
        const [r,g,b] = px(x,y); tot++;
        if(chromaOf(r,g,b) > 50 && (r+g+b)/3 > 80) sat++;
      }
      if(tot) best = Math.max(best, sat/tot);
    }
    return best;
  }
  tokens.forEach(t => {
    if(!t.bbox) return;
    const {x0,y0,x1,y1} = t.bbox; const h = Math.max(6, y1-y0);
    const fill = fillRatio(x0, y0, x1, y1);
    const lineBelow = stripMaxRow(x0, y1+2, x1, Math.min(H, y1 + h*0.7));
    const lineAbove = stripMaxRow(x0, Math.max(0, y0 - h*0.7), x1, Math.max(1, y0-2));
    const border = Math.max(lineAbove, lineBelow);
    t.mark = {fill: Math.round(fill*100)/100, line: Math.round(Math.max(lineBelow,0)*100)/100, border: Math.round(border*100)/100};
    t.selected = fill > 0.22 || lineBelow > 0.45 || border > 0.55;
  });
}

async function ensureCapTranslations(){
  const st = captureState; if(!st) return;
  st.trans = st.trans || {};
  const groups = computeGroups(st.tokens, st.splitSet);
  const todo = groups.filter(g => st.trans[g.text] === undefined);
  if(!todo.length) return;
  todo.forEach(g => { st.trans[g.text] = null; });
  renderCapGroups();
  for(const g of todo){
    let zh = "";
    try{ zh = await translateText(g.text, "en", "zh-CN"); }catch(e){}
    if(captureState !== st) return;
    st.trans[g.text] = zh || "";
    renderCapGroups();
  }
}

function healEmptyCards(){
  /* Cards whose background enrichment failed (offline, quota, or a
     foreign word like "himmel") sit in the library with no meaning.
     Retry a few of them on each launch so the library heals itself. */
  try{
    if(typeof navigator !== "undefined" && navigator.onLine === false) return;
    const lib = loadLib();
    const targets = Object.keys(lib).filter(t => {
      const c = lib[t];
      return !cardReviewable(c) && !(c.reps || 0) && (c.healTries || 0) < 3;
    }).slice(0, 5);
    if(!targets.length) return;
    targets.forEach(t => { lib[t].healTries = (lib[t].healTries || 0) + 1; });
    saveLib(lib);
    (async () => {
      for(const t of targets){
        try{
          const d = await fetchOnline(t);
          if(d && (d.meaning || d.zh)){
            const lib2 = loadLib(); const c = ensureCard(lib2, t);
            if(c.detail && c.detail.contextWords) d.contextWords = c.detail.contextWords;
            if(c.detail && c.detail.source) d.source = c.detail.source;
            c.detail = d; c.unknown = false; saveLib(lib2);
          }
        }catch(e){}
      }
      refreshAll();
    })();
  }catch(e){}
}

function clozeOf(sent, term){

    panel.innerHTML = '<div class="panel"><div style="font-size:16.5px;line-height:1.8">' + escapeHtml(sent) + '</div>' +
      '<div style="display:flex;gap:9px;margin-top:14px;flex-wrap:wrap">' +
      '<button class="pillbtn" data-action="mode-listen">听原音</button>' +
      '<button class="pillbtn ghost" data-action="mode-record" id="recBtn">录音</button>' +
      '<button class="pillbtn ghost" data-action="mode-play" id="playBtn" disabled>回放</button></div>' +
      '<div class="recstat" id="recStat"></div>' +
      '<div class="recstat" id="recScore" style="color:#111;font-weight:700"></div>' +
      '<div class="faces hidden" id="faceRow"><span style="font-size:13px;font-weight:700">自评</span>' +
      FACE_SVGS.map((f, i) => '<button class="face" data-action="mode-face" data-i="' + i + '" aria-label="' + f[0] + '">' + f[1] + '</button>').join("") +
      '</div></div>';
  }else{
    const cz = clozeOf(sent, term);
    if(cz) modeState.target = cz.target;
    panel.innerHTML = '<div class="panel">' +
      (cz ? '<div style="font-size:16.5px;line-height:1.8">' + cz.html + '</div>' +
        '<canvas id="pad" style="margin-top:14px"></canvas>' +
        '<div style="display:flex;gap:9px;margin-top:14px;align-items:center">' +
        '<button class="pillbtn ghost" data-action="mode-clear">清除</button>' +
        '<button class="pillbtn" data-action="mode-check">核对</button>' +
        '<span class="cloze-ans" id="clozeAns"></span></div>'
      : '<div class="meaning">这张卡的例句里没有出现卡面词，挖空暂不可用。</div>') +
      '</div>';
    if(cz) initPad();
  }
  scrollToEl(panel);
}
function setRecStat(t){ const el = document.getElementById("recStat"); if(el) el.textContent = t; }
function estSpeakSecs(s){ return Math.max(1.2, String(s).trim().split(/\s+/).length / 2.4); }
function showRecScore(){
  const el = document.getElementById("recScore"); if(!el || !modeState) return;
  const est = estSpeakSecs(modeState.sent), ratio = recSecs / est;
  const lvl = (ratio > 0.75 && ratio < 1.6) ? "完整度 高" : (ratio >= 0.45 ? "完整度 中" : "完整度 待提高");
  el.textContent = "粗评：" + lvl + "（原音约 " + est.toFixed(1) + "s · 你读了 " + recSecs.toFixed(1) + "s）";
  const fr = document.getElementById("faceRow"); if(fr) fr.classList.remove("hidden");
}
function recUnavailable(){
  setRecStat("录音不可用：这个环境拿不到麦克风。可以照常出声跟读，再用下方自评记一下感觉。");
  const fr = document.getElementById("faceRow"); if(fr) fr.classList.remove("hidden");
}
async function toggleRecord(){
  if(recorder && recorder.state === "recording"){ recorder.stop(); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){ recUnavailable(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    recChunks = []; recSecs = 0;
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => { if(e.data && e.data.size) recChunks.push(e.data); };
    recorder.onstop = () => {
      clearInterval(recTimer);
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(recChunks, {type: recorder.mimeType || "audio/mp4"});
      if(modeState){
        if(modeState.blobUrl) URL.revokeObjectURL(modeState.blobUrl);
        modeState.blobUrl = URL.createObjectURL(blob);
      }
      const rb = document.getElementById("recBtn"); if(rb) rb.textContent = "重新录音";
      const pb = document.getElementById("playBtn"); if(pb) pb.disabled = false;
      setRecStat("你的录音 " + recSecs.toFixed(1) + "s —— 点「回放」听自己的声音");
      showRecScore();
      recorder = null;
    };
    recorder.start();
    const rb = document.getElementById("recBtn"); if(rb) rb.textContent = "停止录音";
    setRecStat("录音中 0.0s");
    recTimer = setInterval(() => { recSecs += 0.1; setRecStat("录音中 " + recSecs.toFixed(1) + "s"); }, 100);
  }catch(e){ recUnavailable(); }
}
function initPad(){
  const cv = document.getElementById("pad"); if(!cv) return;
  const ctx = cv.getContext("2d"); if(!ctx) return; padCtx = ctx;
  const r = cv.getBoundingClientRect();
  cv.width = Math.max(300, Math.round(r.width * 2)); cv.height = 300;
  ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#111";
  let drawing = false;
  const pos = e => { const b = cv.getBoundingClientRect();
    return {x: (e.clientX - b.left) * cv.width / b.width, y: (e.clientY - b.top) * cv.height / b.height}; };
  cv.addEventListener("pointerdown", e => { drawing = true; const p = pos(e);
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
    try{ cv.setPointerCapture(e.pointerId); }catch(err){} e.preventDefault(); });
  cv.addEventListener("pointermove", e => { if(!drawing) return; const p = pos(e);
    ctx.lineTo(p.x, p.y); ctx.stroke(); });
  cv.addEventListener("pointerup", () => { drawing = false; });
  cv.addEventListener("pointercancel", () => { drawing = false; });
}

/* ================= Tabs & global actions ================= */
function switchTab(name){
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x.dataset.tab === name));
  const nm = document.getElementById("navMore");
  if(nm) nm.classList.toggle("active", name === "library" || name === "settings" || name === "stats");
  ["search","capture","review","library","settings","stats"].forEach(id =>
    document.getElementById(id + "Tab").classList.toggle("hidden", id !== name));
  if(name === "library") renderLibrary();
  if(name === "stats") renderStats();
  if(name === "review" && !session){
    const libR = loadLib();
    const q2 = reviewQueueTerms(libR);
    if(q2.length){
      const qu = capNewCards(Array.from(new Set(q2)), libR);
      undoState = null;
      session = {queue: qu.slice(), total: qu.length, done: 0,
        stats: {again:0, hard:0, good:0, easy:0}, current: null, showing: false, requeued: {}};
      nextCard();
    }else{
      document.getElementById("session").innerHTML =
        '<div class="card empty">今天没有待复习的卡片 🎉<div class="actions" style="justify-content:center"><button data-action="goto-search">去查新词</button></div></div>';
    }
  }
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if(!el) return;
  const a = el.dataset.action, term = el.dataset.term;
  if(a === "speak") speak(el.dataset.text, el.dataset.audio || "");
  else if(a === "lookup") search(term);
  else if(a === "start-review") startReview();
  else if(a === "start-review-one") startReview(term);
  else if(a === "show-answer"){ if(session){ session.showing = true; renderCardBack(); } }
  else if(a === "grade") gradeCurrent(el.dataset.grade);
  else if(a === "undo-grade"){
    const u = undoState;
    if(u){
      const libU = loadLib(); const cU = ensureCard(libU, u.term);
      Object.assign(cU, u.prev); saveLib(libU);
      const dsu = loadDayStats();
      dsu.done = Math.max(0, dsu.done - 1);
      if(u.grade === "good" || u.grade === "easy") dsu.mastered = Math.max(0, dsu.mastered - 1);
      if(u.grade === "again") dsu.failed = Math.max(0, dsu.failed - 1);
      saveDayStats(dsu);
      undoState = null;
      if(session && u.sessionRef === session){
        if(session.current) session.queue.unshift(session.current);
        session.current = u.term; session.showing = false;
        session.done = u.doneBefore; session.stats = u.statsBefore; session.total = u.totalBefore;
        renderCardFront();
      }else{
        session = {queue: [], total: u.totalBefore, done: u.doneBefore,
          stats: u.statsBefore, current: u.term, showing: false, requeued: {}};
        switchTab("review");
        renderCardFront();
      }
      refreshAll(); toast("已撤销上一张评分");
    }
  }
  else if(a === "goto-search") switchTab("search");
  else if(a === "dismiss-batch"){
    const bd = document.getElementById("batchDone");
    if(bd){ bd.classList.add("hidden"); bd.innerHTML = ""; }
  }
  else if(a === "mode-speak") openMode("speak");
  else if(a === "mode-cloze") openMode("cloze");
  else if(a === "mode-listen"){ if(modeState) speak(modeState.sent, ""); }
  else if(a === "mode-record") toggleRecord();
  else if(a === "mode-play"){
    if(modeState && modeState.blobUrl){ try{ new Audio(modeState.blobUrl).play(); }catch(e){} }
  }
  else if(a === "mode-face"){
    document.querySelectorAll(".face").forEach(f => f.classList.remove("on"));
    el.classList.add("on");
  }
  else if(a === "mode-clear"){
    const cv = document.getElementById("pad");
    if(cv && padCtx) padCtx.clearRect(0, 0, cv.width, cv.height);
    const ca = document.getElementById("clozeAns"); if(ca) ca.textContent = "";
  }
  else if(a === "mode-check"){
    const ca = document.getElementById("clozeAns");
    if(ca && modeState) ca.textContent = modeState.target || "";
  }
  else if(a === "lookup-term"){
    const t = el.dataset.term;
    if(t){ document.getElementById("q").value = t; switchTab("search"); search(t); }
  }
  else if(a === "remove"){
    const lib = loadLib(); delete lib[term]; saveLib(lib); refreshAll(); renderLibrary(); toast("已删除");
  }
  else if(a === "ai-deep"){
    el.disabled = true; el.textContent = "✨ AI 查询中…";
    aiLookup(term).then(d => {
      if(d){
        const lib = loadLib(); const c = ensureCard(lib, term);
        c.detail = d; c.unknown = false; saveLib(lib);
        renderResult(term, d); refreshAll(); toast("AI 资料已生成并存入词库");
      }
    }).catch(err => toast(String(err.message||err))).finally(()=> { el.disabled = false; });
  }
  else if(a === "cap-lookup-all"){
    if(captureState){
      const phrase = captureState.tokens.map(t => cleanTerm(t.raw)).filter(Boolean).join(" ");
      closeCaptureTask();
      if(phrase){ switchTab("search"); search(phrase); }
    }
  }
  else if(a === "cap-tok"){
    const i = +el.dataset.i;
    if(captureState){ captureState.tokens[i].selected = !captureState.tokens[i].selected; renderCapture(); }
  }
  else if(a === "cap-split"){
    if(captureState){
      const g = computeGroups(captureState.tokens, captureState.splitSet).find(x => x.start === +el.dataset.start);
      if(g) g.indices.slice(1).forEach(idx => captureState.splitSet.add(idx));
      renderCapture();
    }
  }
  else if(a === "cap-confirm"){
    if(captureState){
      const srcEl = document.getElementById("capSource");
      const src = srcEl ? srcEl.value.trim() : "";
      const groups = computeGroups(captureState.tokens, captureState.splitSet);
      const batchId = Date.now();
      const lib = loadLib(); const terms = groups.map(g => g.text);
      groups.forEach(g => {
        const c = ensureCard(lib, g.text);
        c.detail = Object.assign({}, c.detail || {});
        const capZh = (captureState.trans || {})[g.text];
        if(capZh && !c.detail.zh) c.detail.zh = capZh;
        c.detail.contextWords = terms.slice();
        c.detail.contextSentence = "";
        c.detail.source = src;
        c.batch = batchId;
      });
      saveLib(lib);
      window.__lastBatch = terms;
      closeCaptureTask();
      const bd = document.getElementById("batchDone");
      if(bd){
        bd.classList.remove("hidden");
        bd.innerHTML = '<div class="donecard"><div style="font-size:17px;font-weight:800">✓ 已生成 ' + terms.length + ' 张闪卡</div>' +
          '<div style="margin-top:4px">已加入复习队列 <span id="enrichProg">（补全释义 0/' + terms.length + '）</span></div>' +
          '<div class="actions"><button data-action="start-review">开始复习</button>' +
          '<button class="secondary" data-action="dismiss-batch">完成</button></div></div>';
        scrollToEl(bd);
      }
      refreshAll();
      (async () => {
        let done = 0;
        const enrichOne = async (term) => {
          try{
            const lib2 = loadLib(); const card = ensureCard(lib2, term);
            const cw = (card.detail && card.detail.contextWords) || null;
            const srcv = (card.detail && card.detail.source) || "";
            let d = findLocal(term) || card.detail;
            if(!findLocal(term) && (!d || !d.meaning || (d.v || 0) < 2)){
              const on = await fetchOnline(term);
              if(on) d = on;
            }
            if(d){
              const aiS = aiSettings();
              if(aiS.key && aiS.auto !== false && detailIncomplete(d)){
                try{ const ai = await aiLookup(term); if(ai) d = mergeAiDetail(d, ai); }catch(e){}
              }
              d = Object.assign({}, d);
              if(cw) d.contextWords = cw;
              d.contextSentence = "";
              d.source = srcv;
              card.detail = d; card.unknown = false; saveLib(lib2);
            }
          }catch(e){}
          done++;
          const p = document.getElementById("enrichProg");
          if(p) p.textContent = done < terms.length ? "（补全释义 " + done + "/" + terms.length + "）" : "（释义已补全）";
        };
        for(let i = 0; i < terms.length; i += 3){
          await Promise.all(terms.slice(i, i + 3).map(enrichOne));
        }
        refreshAll();
      })();
    }
  }
  else if(a === "ocr-all"){
    const words = (el.dataset.words||"").split(",").filter(Boolean);
    const lib = loadLib();
    words.forEach(w => { const c = ensureCard(lib, w); const l = findLocal(w); if(l) c.detail = l; });
    saveLib(lib); refreshAll();
    session = {queue: words.slice(), total: words.length, done: 0,
      stats: {again:0, hard:0, good:0, easy:0}, current: null, showing: false, requeued: {}};
    switchTab("review"); nextCard();
    toast("已把 " + words.length + " 个词做成闪卡");
  }
});
